services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: yangcheng-tracehub:latest
    container_name: yangcheng-tracehub
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    volumes:
      - ./data/db:/app/data
      - ./data/uploads:/app/public/uploads

  nginx:
    image: nginx:alpine
    container_name: yangcheng-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
