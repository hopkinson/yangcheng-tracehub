services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yangcheng-tracehub
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:./dev.db
      - NODE_ENV=production
    volumes:
      - tracehub_data:/app/prisma

volumes:
  tracehub_data:
