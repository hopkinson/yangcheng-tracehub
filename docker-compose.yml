services:
  db:
    image: postgres:16-alpine
    container_name: yangcheng-db
    restart: always
    environment:
      POSTGRES_USER: yangcheng
      POSTGRES_PASSWORD: yangcheng_local_pwd
      POSTGRES_DB: yangcheng
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yangcheng -d yangcheng"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: yangcheng-tracehub:prod
    container_name: yangcheng-tracehub
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    volumes:
      - ./data/uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  app-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: yangcheng-tracehub:test
    container_name: yangcheng-tracehub-test
    restart: always
    ports:
      - "3001:3000"
    env_file:
      - .env.test
    environment:
      ALLOW_DATA_RESET: "test-only"
    volumes:
      - ./data-test/uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: yangcheng-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
      - app-test

