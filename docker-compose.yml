services:
  app:
    image: ghcr.io/hopkinson/yangcheng-tracehub:latest
    container_name: yangcheng-tracehub
    restart: always
    command: sh -c "prisma db push --skip-generate && node server.js"
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    volumes:
      - ./data/db:/app/data
      - ./data/uploads:/app/public/uploads

  nginx:
    image: nginx:alpine
    container_name: yangcheng-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app

  watchtower:
    image: containrrr/watchtower
    container_name: yangcheng-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 --cleanup yangcheng-tracehub
