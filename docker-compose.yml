services:
  app:
    image: ghcr.io/hopkinson/yangcheng-tracehub:latest
    container_name: yangcheng-tracehub
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    volumes:
      - ./data/db:/app/data
      - ./data/uploads:/app/public/uploads

  app-test:
    image: ghcr.io/hopkinson/yangcheng-tracehub:latest
    container_name: yangcheng-tracehub-test
    restart: always
    ports:
      - "3001:3000"
    env_file:
      - .env.test
    volumes:
      - ./data-test/db:/app/data
      - ./data-test/uploads:/app/public/uploads

  nginx:
    image: nginx:alpine
    container_name: yangcheng-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
      - app-test
