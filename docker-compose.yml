services:
  app:
    image: ghcr.io/hopkinson/yangcheng-tracehub:latest
    container_name: yangcheng-tracehub
    restart: always
    command: sh -c "npx prisma db push --skip-generate && node server.js"
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    volumes:
      - ./data/db:/app/data
      - ./data/uploads:/app/public/uploads
