name: "阳澄溯源系统 · 自动测试与 GHCR 生产部署流水线"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: "自动化测试与 GHCR 镜像构建部署"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SERVER_HOST_1: ${{ secrets.SERVER_HOST_1 || vars.SERVER_HOST_1 || secrets.SERVER_HOST || vars.SERVER_HOST }}
      SERVER_HOST_2: ${{ secrets.SERVER_HOST_2 || vars.SERVER_HOST_2 || secrets.SERVER_2_HOST || vars.SERVER_2_HOST || secrets.SERVER2_HOST || vars.SERVER2_HOST || secrets.SERVER_HOST2 || vars.SERVER_HOST2 || secrets.BACKUP_SERVER_HOST || vars.BACKUP_SERVER_HOST || secrets.SERVER_IP_2 || vars.SERVER_IP_2 || secrets.SERVER2_IP || vars.SERVER2_IP }}
    steps:
      - name: "检出代码仓库"
        uses: actions/checkout@v4

      - name: "初始化 pnpm 环境"
        uses: pnpm/action-setup@v4

      - name: "配置 Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: "安装项目依赖"
        run: pnpm install --frozen-lockfile

      - name: "生成 Prisma 客户端"
        run: pnpm prisma:generate

      - name: "TypeScript 类型安全检查"
        run: pnpm typecheck

      - name: "初始化测试数据库并运行自动化测试"
        env:
          DATABASE_URL: "file:./dev.db"
          AUTH_SECRET: "test-secret-key-123456"
        run: |
          npx prisma db push
          npx tsx prisma/seed.ts
          pnpm test

      - name: "登录 GitHub Container Registry (GHCR)"
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "配置 Docker Buildx 构建引擎"
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: "构建并推送生产 Docker 镜像至 GHCR"
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =========================================================================
      # 构建结果与 Watchtower 自动部署状态汇报
      # =========================================================================
      - name: "汇报生产镜像构建与自动部署就绪状态"
        if: github.event_name != 'pull_request'
        run: |
          echo "=================================================="
          echo "🚀 [成功] 生产 Docker 镜像已成功推送到 GHCR！"
          echo "  - 镜像地址: ghcr.io/${{ github.repository }}:latest"
          echo "  - Commit SHA: ${{ github.sha }}"
          echo "=================================================="
          echo "💡 [零端口安全部署模式]"
          echo "   服务器无需开放 22 端口，服务器常驻的 Watchtower 容器"
          echo "   会在 60 秒内自动检测到此镜像，并自动平滑重启上线！"
          echo "=================================================="
