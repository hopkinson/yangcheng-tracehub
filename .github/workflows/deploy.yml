name: "阳澄溯源系统 · 生产部署流水线"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: "Self-Hosted 极速部署"
    runs-on: self-hosted
    steps:
      - name: "检出代码仓库"
        uses: actions/checkout@v4

      - name: "同步配置与初始化环境"
        run: |
          mkdir -p /opt/yangcheng-tracehub/data/db /opt/yangcheng-tracehub/data/uploads /opt/yangcheng-tracehub/nginx/ssl
          cp docker-compose.yml /opt/yangcheng-tracehub/docker-compose.yml
          cp -r nginx /opt/yangcheng-tracehub/
          if [ ! -f /opt/yangcheng-tracehub/.env.production ]; then
            cat << 'EOF' > /opt/yangcheng-tracehub/.env.production
          NODE_ENV=production
          PORT=3000
          DATABASE_URL="file:/app/data/prod.db"
          AUTH_SECRET="yangcheng-tracehub-secret-2026"
          EOF
          fi

      - name: "本地构建并启动应用"
        run: |
          cd /opt/yangcheng-tracehub
          docker compose build app
          docker compose up -d --remove-orphans app

      - name: "健康状态检查"
        run: |
          for i in $(seq 1 10); do
            curl -sf http://127.0.0.1:3000/api/health > /dev/null && echo "应用健康检查通过！" && exit 0 || sleep 2
          done
          docker compose -f /opt/yangcheng-tracehub/docker-compose.yml ps
