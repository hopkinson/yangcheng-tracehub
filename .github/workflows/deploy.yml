name: CI/CD Pipeline (Test & Deploy)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST_2: ${{ secrets.SERVER_HOST_2 || secrets.SERVER_2_HOST }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Setup DB & Run Tests
        env:
          DATABASE_URL: "file:./dev.db"
          AUTH_SECRET: "test-secret-key-123456"
        run: |
          npx prisma db push
          npx tsx prisma/seed.ts
          npx tsx test/invariants.test.ts
          npx tsx test/actions.test.ts
          npx tsx test/channel-isolation.test.ts

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Standalone)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: yangcheng-tracehub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save & Compress Docker Image
        if: github.event_name != 'pull_request'
        run: |
          docker pull nginx:alpine
          docker save yangcheng-tracehub:latest nginx:alpine | gzip -9 > image.tar.gz
          echo "Compressed image size:"
          ls -lh image.tar.gz

      # =========================================================================
      # 部署到服务器 1 (Server 1)
      # =========================================================================
      - name: Transfer Image & Deploy to Server 1 via SSH
        if: github.event_name != 'pull_request'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST_1 || secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER_1 || secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY_1 || secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD_1 || secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT_1 || secrets.SERVER_PORT || 22 }}
          source: "image.tar.gz,docker-compose.yml,nginx/default.conf"
          target: "/opt/yangcheng-tracehub"

      - name: Load Image and Restart Container on Server 1
        if: github.event_name != 'pull_request'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST_1 || secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER_1 || secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY_1 || secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD_1 || secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT_1 || secrets.SERVER_PORT || 22 }}
          script: |
            mkdir -p /opt/yangcheng-tracehub/data/db /opt/yangcheng-tracehub/data/uploads /opt/yangcheng-tracehub/nginx
            cd /opt/yangcheng-tracehub

            # 导入镜像并清理临时包
            gunzip -c image.tar.gz | docker load
            rm -f image.tar.gz

            # 如果不存在生产环境变量文件，则自动创建默认配置
            if [ ! -f .env.production ]; then
              cat << 'EOF' > .env.production
            NODE_ENV=production
            PORT=3000
            DATABASE_URL="file:/app/data/prod.db"
            AUTH_SECRET="yangcheng-tracehub-secret-2026"
            EOF
            fi

            # 启动容器
            docker compose down || true
            docker compose up -d --remove-orphans

      # =========================================================================
      # 部署到服务器 2 (Server 2) - 仅在配置了 SERVER_HOST_2 时执行
      # =========================================================================
      - name: Transfer Image & Deploy to Server 2 via SSH
        if: github.event_name != 'pull_request' && env.SERVER_HOST_2 != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST_2 }}
          username: ${{ secrets.SERVER_USER_2 || secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY_2 || secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD_2 || secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT_2 || secrets.SERVER_PORT || 22 }}
          source: "image.tar.gz,docker-compose.yml,nginx/default.conf"
          target: "/opt/yangcheng-tracehub"

      - name: Load Image and Restart Container on Server 2
        if: github.event_name != 'pull_request' && env.SERVER_HOST_2 != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST_2 }}
          username: ${{ secrets.SERVER_USER_2 || secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY_2 || secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD_2 || secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT_2 || secrets.SERVER_PORT || 22 }}
          script: |
            mkdir -p /opt/yangcheng-tracehub/data/db /opt/yangcheng-tracehub/data/uploads /opt/yangcheng-tracehub/nginx
            cd /opt/yangcheng-tracehub

            # 导入镜像并清理临时包
            gunzip -c image.tar.gz | docker load
            rm -f image.tar.gz

            # 如果不存在生产环境变量文件，则自动创建默认配置
            if [ ! -f .env.production ]; then
              cat << 'EOF' > .env.production
            NODE_ENV=production
            PORT=3000
            DATABASE_URL="file:/app/data/prod.db"
            AUTH_SECRET="yangcheng-tracehub-secret-2026"
            EOF
            fi

            # 启动容器
            docker compose down || true
            docker compose up -d --remove-orphans
