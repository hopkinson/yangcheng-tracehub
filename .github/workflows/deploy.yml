name: CI/CD Pipeline (Test & Deploy)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Setup DB & Run Tests
        run: |
          npx prisma db push
          npx tsx test/invariants.test.ts
          npx tsx test/actions.test.ts
          npx tsx test/channel-isolation.test.ts

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Standalone)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: yangcheng-tracehub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save & Compress Docker Image
        if: github.event_name != 'pull_request'
        run: |
          docker save yangcheng-tracehub:latest | gzip -9 > image.tar.gz
          echo "Compressed image size:"
          ls -lh image.tar.gz

      - name: Transfer Image & Deploy via SSH
        if: github.event_name != 'pull_request'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "image.tar.gz,docker-compose.yml"
          target: "/data/yangcheng-tracehub"

      - name: Load Image and Restart Container on ECS
        if: github.event_name != 'pull_request'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /data/yangcheng-tracehub/data/prisma /data/yangcheng-tracehub/data/uploads
            cd /data/yangcheng-tracehub

            # 导入镜像并清理临时包
            gunzip -c image.tar.gz | docker load
            rm -f image.tar.gz

            # 如果不存在生产环境变量文件，则自动创建默认配置
            if [ ! -f .env.production ]; then
              cat << 'EOF' > .env.production
            NODE_ENV=production
            PORT=3000
            DATABASE_URL="file:./dev.db"
            AUTH_SECRET="yangcheng-tracehub-secret-2026"
            EOF
            fi

            # 启动容器
            docker compose down || true
            docker compose up -d --remove-orphans

