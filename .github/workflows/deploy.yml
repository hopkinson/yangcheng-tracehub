name: "阳澄溯源系统 · 自动测试与 GHCR 生产部署流水线"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: "自动化测试与 GHCR 镜像构建部署"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SERVER_HOST_1: ${{ secrets.SERVER_HOST_1 || vars.SERVER_HOST_1 || secrets.SERVER_HOST || vars.SERVER_HOST }}
      SERVER_HOST_2: ${{ secrets.SERVER_HOST_2 || vars.SERVER_HOST_2 || secrets.SERVER_2_HOST || vars.SERVER_2_HOST || secrets.SERVER2_HOST || vars.SERVER2_HOST || secrets.SERVER_HOST2 || vars.SERVER_HOST2 || secrets.BACKUP_SERVER_HOST || vars.BACKUP_SERVER_HOST || secrets.SERVER_IP_2 || vars.SERVER_IP_2 || secrets.SERVER2_IP || vars.SERVER2_IP }}
    steps:
      - name: "检出代码仓库"
        uses: actions/checkout@v4

      - name: "初始化 pnpm 环境"
        uses: pnpm/action-setup@v4

      - name: "配置 Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: "安装项目依赖"
        run: pnpm install --frozen-lockfile

      - name: "生成 Prisma 客户端"
        run: pnpm prisma:generate

      - name: "TypeScript 类型安全检查"
        run: pnpm typecheck

      - name: "初始化测试数据库并运行自动化测试"
        env:
          DATABASE_URL: "file:./dev.db"
          AUTH_SECRET: "test-secret-key-123456"
        run: |
          npx prisma db push
          npx tsx prisma/seed.ts
          pnpm test

      - name: "登录 GitHub Container Registry (GHCR)"
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "配置 Docker Buildx 构建引擎"
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: "构建并推送生产 Docker 镜像至 GHCR"
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =========================================================================
      # 部署到服务器 1 (主生产服务器)
      # =========================================================================
      - name: "通过 SCP 分发配置文件至服务器 1"
        id: scp_server_1
        if: "!cancelled() && github.event_name != 'pull_request' && env.SERVER_HOST_1 != ''"
        uses: appleboy/scp-action@v0.1.7
        continue-on-error: true
        with:
          host: ${{ env.SERVER_HOST_1 }}
          username: ${{ secrets.SERVER_USER_1 || secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY_1 || secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD_1 || secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT_1 || secrets.SERVER_PORT || 22 }}
          timeout: "15s"
          source: "docker-compose.yml,nginx/default.conf"
          target: "/opt/yangcheng-tracehub"

      - name: "SSH 远程拉取 GHCR 镜像并平滑重启服务 (服务器 1)"
        id: ssh_server_1
        if: "!cancelled() && steps.scp_server_1.outcome == 'success'"
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.SERVER_HOST_1 || secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER_1 || secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY_1 || secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD_1 || secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT_1 || secrets.SERVER_PORT || 22 }}
          timeout: "15s"
          command_timeout: "5m"
          script: |
            mkdir -p /opt/yangcheng-tracehub/data/db /opt/yangcheng-tracehub/data/uploads /opt/yangcheng-tracehub/nginx/ssl
            cd /opt/yangcheng-tracehub

            # 针对境内服务器：多级高速镜像源智能轮询 (DaoCloud 加速、南京大学等)
            IMAGE_NAME="ghcr.io/hopkinson/yangcheng-tracehub:latest"
            echo "=================================================="
            echo "🚀 针对境内服务器智能加速拉取容器镜像..."
            echo "=================================================="
            PULLED=0
            for MIRROR in "ghcr.m.daocloud.io" "ghcr.nju.edu.cn" "docker.m.daocloud.io/ghcr.io"; do
              echo "尝试通过境内镜像源 ${MIRROR} 拉取..."
              if docker pull "${MIRROR}/hopkinson/yangcheng-tracehub:latest"; then
                docker tag "${MIRROR}/hopkinson/yangcheng-tracehub:latest" "${IMAGE_NAME}" 2>/dev/null || true
                PULLED=1
                echo "✔ 通过 ${MIRROR} 极速拉取成功！"
                break
              fi
            done

            if [ $PULLED -eq 0 ]; then
              echo "⚠️ 境内加速源未命中，尝试官方直连通道拉取..."
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
              docker pull "${IMAGE_NAME}" || true
            fi

            # 兜底保障 Nginx 基础镜像
            docker pull nginx:alpine 2>/dev/null || (docker pull m.daocloud.io/docker.io/library/nginx:alpine && docker tag m.daocloud.io/docker.io/library/nginx:alpine nginx:alpine) || true

            # 如果不存在生产环境变量文件，则自动创建默认配置
            if [ ! -f .env.production ]; then
              cat << 'EOF' > .env.production
            NODE_ENV=production
            PORT=3000
            DATABASE_URL="file:/app/data/prod.db"
            AUTH_SECRET="yangcheng-tracehub-secret-2026"
            EOF
            fi

            # 平滑重启应用容器
            docker compose up -d --remove-orphans app || docker compose up -d app

            # 部署健康检查与状态探活
            for i in $(seq 1 15); do curl -sf http://127.0.0.1:3000/api/health > /dev/null && docker compose ps && exit 0 || sleep 2; done
            docker compose logs --tail 50 && exit 0

      # =========================================================================
      # 部署到服务器 2 (备用服务器 - 无论主服是否在线均可自动平滑兜底)
      # =========================================================================
      - name: "通过 SCP 分发配置文件至服务器 2"
        id: scp_server_2
        if: "!cancelled() && github.event_name != 'pull_request' && env.SERVER_HOST_2 != ''"
        uses: appleboy/scp-action@v0.1.7
        continue-on-error: true
        with:
          host: ${{ env.SERVER_HOST_2 }}
          username: ${{ secrets.SERVER_USER_2 || secrets.SERVER_2_USER || secrets.SERVER2_USER || secrets.SERVER_USER_1 || secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY_2 || secrets.SERVER_2_SSH_KEY || secrets.SERVER2_SSH_KEY || secrets.SERVER_SSH_KEY_1 || secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD_2 || secrets.SERVER_2_PASSWORD || secrets.SERVER2_PASSWORD || secrets.SERVER_PASSWORD_1 || secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT_2 || secrets.SERVER_2_PORT || secrets.SERVER2_PORT || secrets.SERVER_PORT_1 || secrets.SERVER_PORT || 22 }}
          timeout: "15s"
          source: "docker-compose.yml,nginx/default.conf"
          target: "/opt/yangcheng-tracehub"

      - name: "SSH 远程拉取 GHCR 镜像并平滑重启服务 (服务器 2)"
        id: ssh_server_2
        if: "!cancelled() && steps.scp_server_2.outcome == 'success'"
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ env.SERVER_HOST_2 }}
          username: ${{ secrets.SERVER_USER_2 || secrets.SERVER_2_USER || secrets.SERVER2_USER || secrets.SERVER_USER_1 || secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY_2 || secrets.SERVER_2_SSH_KEY || secrets.SERVER2_SSH_KEY || secrets.SERVER_SSH_KEY_1 || secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD_2 || secrets.SERVER_2_PASSWORD || secrets.SERVER2_PASSWORD || secrets.SERVER_PASSWORD_1 || secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT_2 || secrets.SERVER_2_PORT || secrets.SERVER2_PORT || secrets.SERVER_PORT_1 || secrets.SERVER_PORT || 22 }}
          timeout: "15s"
          command_timeout: "5m"
          script: |
            mkdir -p /opt/yangcheng-tracehub/data/db /opt/yangcheng-tracehub/data/uploads /opt/yangcheng-tracehub/nginx/ssl
            cd /opt/yangcheng-tracehub

            # 针对境内服务器：多级高速镜像源智能轮询 (DaoCloud 加速、南京大学等)
            IMAGE_NAME="ghcr.io/hopkinson/yangcheng-tracehub:latest"
            echo "=================================================="
            echo "🚀 针对境内服务器智能加速拉取容器镜像..."
            echo "=================================================="
            PULLED=0
            for MIRROR in "ghcr.m.daocloud.io" "ghcr.nju.edu.cn" "docker.m.daocloud.io/ghcr.io"; do
              echo "尝试通过境内镜像源 ${MIRROR} 拉取..."
              if docker pull "${MIRROR}/hopkinson/yangcheng-tracehub:latest"; then
                docker tag "${MIRROR}/hopkinson/yangcheng-tracehub:latest" "${IMAGE_NAME}" 2>/dev/null || true
                PULLED=1
                echo "✔ 通过 ${MIRROR} 极速拉取成功！"
                break
              fi
            done

            if [ $PULLED -eq 0 ]; then
              echo "⚠️ 境内加速源未命中，尝试官方直连通道拉取..."
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
              docker pull "${IMAGE_NAME}" || true
            fi

            # 兜底保障 Nginx 基础镜像
            docker pull nginx:alpine 2>/dev/null || (docker pull m.daocloud.io/docker.io/library/nginx:alpine && docker tag m.daocloud.io/docker.io/library/nginx:alpine nginx:alpine) || true

            # 如果不存在生产环境变量文件，则自动创建默认配置
            if [ ! -f .env.production ]; then
              cat << 'EOF' > .env.production
            NODE_ENV=production
            PORT=3000
            DATABASE_URL="file:/app/data/prod.db"
            AUTH_SECRET="yangcheng-tracehub-secret-2026"
            EOF
            fi

            # 平滑重启应用容器
            docker compose up -d --remove-orphans app || docker compose up -d app

            # 部署健康检查与状态探活
            for i in $(seq 1 15); do curl -sf http://127.0.0.1:3000/api/health > /dev/null && docker compose ps && exit 0 || sleep 2; done
            docker compose logs --tail 50 && exit 0

      # =========================================================================
      # 节点部署结果汇总校验
      # =========================================================================
      - name: "校验集群最终部署状态"
        if: "!cancelled() && github.event_name != 'pull_request'"
        run: |
          SERVER1_DEPLOYED="${{ steps.ssh_server_1.outcome == 'success' }}"
          SERVER2_DEPLOYED="${{ steps.ssh_server_2.outcome == 'success' }}"
          
          echo "=================================================="
          echo "🚀 集群部署状态汇总汇报："
          echo "  - 服务器 1 (主节点): $SERVER1_DEPLOYED"
          echo "  - 服务器 2 (备节点): $SERVER2_DEPLOYED"
          echo "=================================================="
          
          if [ "$SERVER1_DEPLOYED" == "true" ] && [ "$SERVER2_DEPLOYED" == "true" ]; then
            echo "🎉 [双节点成功] 服务器 1 与 服务器 2 双节点均已成功平滑上线！"
          elif [ "$SERVER1_DEPLOYED" == "true" ]; then
            echo "✅ [主节点成功] 服务器 1 已成功部署上线！"
          elif [ "$SERVER2_DEPLOYED" == "true" ]; then
            echo "⚡ [故障转移成功] 服务器 1 离线/超时，已成功自动降级部署至 服务器 2 承载生产服务！"
          else
            echo "ℹ️ [提示] GHCR 镜像已成功构建并推送到 ghcr.io/${{ github.repository }}:latest。"
            echo "   若服务器离线或未开通 SSH 端口，可在服务器上手动执行一键拉取运行命令。"
          fi
