name: "阳澄溯源系统 · 自动测试与生产部署流水线"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: "自动化测试与生产部署"
    runs-on: ubuntu-latest
    env:
      SERVER_HOST_2: ${{ secrets.SERVER_HOST_2 || secrets.SERVER_2_HOST || secrets.SERVER2_HOST || secrets.SERVER_HOST2 || secrets.BACKUP_SERVER_HOST || secrets.SERVER_IP_2 || secrets.SERVER2_IP }}
    steps:
      - name: "检出代码仓库"
        uses: actions/checkout@v4

      - name: "初始化 pnpm 环境"
        uses: pnpm/action-setup@v4

      - name: "配置 Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: "安装项目依赖"
        run: pnpm install --frozen-lockfile

      - name: "生成 Prisma 客户端"
        run: pnpm prisma:generate

      - name: "TypeScript 类型安全检查"
        run: pnpm typecheck

      - name: "初始化测试数据库并运行自动化测试"
        env:
          DATABASE_URL: "file:./dev.db"
          AUTH_SECRET: "test-secret-key-123456"
        run: |
          npx prisma db push
          npx tsx prisma/seed.ts
          pnpm test

      - name: "配置 Docker Buildx 构建引擎"
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: "构建生产 Docker 镜像 (Standalone)"
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: yangcheng-tracehub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "拉取 Nginx 并压缩打包镜像产物"
        if: github.event_name != 'pull_request'
        run: |
          docker pull nginx:alpine
          docker save yangcheng-tracehub:latest nginx:alpine | gzip -9 > image.tar.gz
          echo "压缩后镜像包大小:"
          ls -lh image.tar.gz

      # =========================================================================
      # 部署到服务器 1 (主生产服务器 - 具备超时熔断与自动降级)
      # =========================================================================
      - name: "通过 SCP 分发镜像与配置文件至服务器 1"
        id: scp_server_1
        if: "!cancelled() && github.event_name != 'pull_request'"
        uses: appleboy/scp-action@v0.1.7
        continue-on-error: true
        with:
          host: ${{ secrets.SERVER_HOST_1 || secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER_1 || secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY_1 || secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD_1 || secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT_1 || secrets.SERVER_PORT || 22 }}
          timeout: "15s"
          source: "image.tar.gz,docker-compose.yml,nginx/default.conf"
          target: "/opt/yangcheng-tracehub"

      - name: "SSH 远程加载镜像并平滑重启服务 (服务器 1)"
        id: ssh_server_1
        if: "!cancelled() && steps.scp_server_1.outcome == 'success'"
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.SERVER_HOST_1 || secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER_1 || secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY_1 || secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD_1 || secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT_1 || secrets.SERVER_PORT || 22 }}
          timeout: "15s"
          command_timeout: "10m"
          script: |
            mkdir -p /opt/yangcheng-tracehub/data/db /opt/yangcheng-tracehub/data/uploads /opt/yangcheng-tracehub/nginx/ssl
            cd /opt/yangcheng-tracehub

            # 导入镜像并清理临时包
            gunzip -c image.tar.gz | docker load
            rm -f image.tar.gz

            # 若未配置证书，自动生成自签名证书兜底，防止 Nginx 启动崩溃
            if [ ! -f /opt/yangcheng-tracehub/nginx/ssl/fullchain.pem ] || [ ! -f /opt/yangcheng-tracehub/nginx/ssl/privkey.pem ]; then
              echo "生成兜底自签名 SSL 证书..."
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout /opt/yangcheng-tracehub/nginx/ssl/privkey.pem \
                -out /opt/yangcheng-tracehub/nginx/ssl/fullchain.pem \
                -subj "/CN=admin.yangchenghu88.com"
            fi

            # 如果不存在生产环境变量文件，则自动创建默认配置
            if [ ! -f .env.production ]; then
              cat << 'EOF' > .env.production
            NODE_ENV=production
            PORT=3000
            DATABASE_URL="file:/app/data/prod.db"
            AUTH_SECRET="yangcheng-tracehub-secret-2026"
            EOF
            fi

            # 启动容器
            docker compose down || true
            docker compose up -d --remove-orphans

            # 部署健康检查与状态探活
            for i in $(seq 1 15); do curl -sf http://127.0.0.1:3000/api/health > /dev/null && docker compose ps && exit 0 || sleep 2; done
            docker compose logs --tail 50 && exit 1

      # =========================================================================
      # 部署到服务器 2 (备用服务器 - 无论主服是否在线均可自动平滑兜底)
      # =========================================================================
      - name: "通过 SCP 分发镜像与配置文件至服务器 2"
        id: scp_server_2
        if: "!cancelled() && github.event_name != 'pull_request' && env.SERVER_HOST_2 != ''"
        uses: appleboy/scp-action@v0.1.7
        continue-on-error: true
        with:
          host: ${{ env.SERVER_HOST_2 }}
          username: ${{ secrets.SERVER_USER_2 || secrets.SERVER_2_USER || secrets.SERVER2_USER || secrets.SERVER_USER_1 || secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY_2 || secrets.SERVER_2_SSH_KEY || secrets.SERVER2_SSH_KEY || secrets.SERVER_SSH_KEY_1 || secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD_2 || secrets.SERVER_2_PASSWORD || secrets.SERVER2_PASSWORD || secrets.SERVER_PASSWORD_1 || secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT_2 || secrets.SERVER_2_PORT || secrets.SERVER2_PORT || secrets.SERVER_PORT_1 || secrets.SERVER_PORT || 22 }}
          timeout: "15s"
          source: "image.tar.gz,docker-compose.yml,nginx/default.conf"
          target: "/opt/yangcheng-tracehub"

      - name: "SSH 远程加载镜像并平滑重启服务 (服务器 2)"
        id: ssh_server_2
        if: "!cancelled() && steps.scp_server_2.outcome == 'success'"
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ env.SERVER_HOST_2 }}
          username: ${{ secrets.SERVER_USER_2 || secrets.SERVER_2_USER || secrets.SERVER2_USER || secrets.SERVER_USER_1 || secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY_2 || secrets.SERVER_2_SSH_KEY || secrets.SERVER2_SSH_KEY || secrets.SERVER_SSH_KEY_1 || secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD_2 || secrets.SERVER_2_PASSWORD || secrets.SERVER2_PASSWORD || secrets.SERVER_PASSWORD_1 || secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT_2 || secrets.SERVER_2_PORT || secrets.SERVER2_PORT || secrets.SERVER_PORT_1 || secrets.SERVER_PORT || 22 }}
          timeout: "15s"
          command_timeout: "10m"
          script: |
            mkdir -p /opt/yangcheng-tracehub/data/db /opt/yangcheng-tracehub/data/uploads /opt/yangcheng-tracehub/nginx/ssl
            cd /opt/yangcheng-tracehub

            # 导入镜像并清理临时包
            gunzip -c image.tar.gz | docker load
            rm -f image.tar.gz

            # 若未配置证书，自动生成自签名证书兜底，防止 Nginx 启动崩溃
            if [ ! -f /opt/yangcheng-tracehub/nginx/ssl/fullchain.pem ] || [ ! -f /opt/yangcheng-tracehub/nginx/ssl/privkey.pem ]; then
              echo "生成兜底自签名 SSL 证书..."
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout /opt/yangcheng-tracehub/nginx/ssl/privkey.pem \
                -out /opt/yangcheng-tracehub/nginx/ssl/fullchain.pem \
                -subj "/CN=admin.yangchenghu88.com"
            fi

            # 如果不存在生产环境变量文件，则自动创建默认配置
            if [ ! -f .env.production ]; then
              cat << 'EOF' > .env.production
            NODE_ENV=production
            PORT=3000
            DATABASE_URL="file:/app/data/prod.db"
            AUTH_SECRET="yangcheng-tracehub-secret-2026"
            EOF
            fi

            # 启动容器
            docker compose down || true
            docker compose up -d --remove-orphans

            # 部署健康检查与状态探活
            for i in $(seq 1 15); do curl -sf http://127.0.0.1:3000/api/health > /dev/null && docker compose ps && exit 0 || sleep 2; done
            docker compose logs --tail 50 && exit 1

      # =========================================================================
      # 节点部署结果汇总校验
      # =========================================================================
      - name: "校验集群最终部署状态"
        if: "!cancelled() && github.event_name != 'pull_request'"
        run: |
          SERVER1_DEPLOYED="${{ steps.ssh_server_1.outcome == 'success' }}"
          SERVER2_DEPLOYED="${{ steps.ssh_server_2.outcome == 'success' }}"
          
          echo "=================================================="
          echo "🚀 集群部署状态汇总汇报："
          echo "  - 服务器 1 (主节点): $SERVER1_DEPLOYED"
          echo "  - 服务器 2 (备节点): $SERVER2_DEPLOYED"
          echo "=================================================="
          
          if [ "$SERVER1_DEPLOYED" != "true" ] && [ "$SERVER2_DEPLOYED" != "true" ]; then
            echo "❌ 严重错误: 所有可用服务器 (服务器 1 与 服务器 2) 均部署失败或不可达！"
            exit 1
          fi
          
          if [ "$SERVER1_DEPLOYED" != "true" ] && [ "$SERVER2_DEPLOYED" == "true" ]; then
            echo "⚠️ 提示: 服务器 1 离线/超时，已成功自动降级并由 服务器 2 承载生产服务！"
          elif [ "$SERVER1_DEPLOYED" == "true" ] && [ "$SERVER2_DEPLOYED" != "true" ]; then
            echo "✅ 提示: 服务器 1 部署成功（服务器 2 未配置或离线）。"
          else
            echo "🎉 提示: 服务器 1 与 服务器 2 双节点均已成功同步更新！"
          fi
