name: "部署 · 服务器 2 (yangcheng.traview.cn - 自动部署)"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: server-2-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: "构建并发布到服务器 2"
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      SERVER_HOST_2: ${{ secrets.SERVER_HOST_2 || vars.SERVER_HOST_2 || secrets.SERVER_2_HOST || vars.SERVER_2_HOST }}
      SERVER_USER_2: ${{ secrets.SERVER_USER_2 || vars.SERVER_USER_2 || 'root' }}
      SERVER_PASSWORD_2: ${{ secrets.SERVER_PASSWORD_2 || secrets.SERVER_2_PASSWORD }}
      SERVER_PORT_2: ${{ secrets.SERVER_PORT_2 || vars.SERVER_PORT_2 || 22 }}
    steps:
      - name: "检出代码仓库"
        uses: actions/checkout@v4

      - name: "初始化 pnpm 环境"
        uses: pnpm/action-setup@v4

      - name: "配置 Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: "安装项目依赖"
        run: pnpm install --frozen-lockfile

      - name: "生成 Prisma 客户端"
        run: pnpm prisma:generate

      - name: "TypeScript 类型安全检查"
        run: pnpm typecheck

      # =========================================================================
      # 打包纯净源码 (仅 ~1.8MB) 并通过 SCP 传输至服务器 2，彻底杜绝大镜像包传输超时
      # =========================================================================
      - name: "打包生产源码包"
        if: "github.event_name != 'pull_request' && env.SERVER_HOST_2 != ''"
        run: |
          echo "📦 使用 git archive 打包纯净项目源码..."
          git archive --format=tar.gz -o app-source.tar.gz HEAD
          echo "✅ 源码打包完成，文件大小:"
          ls -lh app-source.tar.gz

      - name: "传输源码包至服务器 2"
        if: "github.event_name != 'pull_request' && env.SERVER_HOST_2 != ''"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST_2 }}
          username: ${{ env.SERVER_USER_2 }}
          password: ${{ env.SERVER_PASSWORD_2 }}
          port: ${{ env.SERVER_PORT_2 }}
          timeout: "60s"
          command_timeout: "5m"
          source: "app-source.tar.gz"
          target: "/tmp"
          overwrite: true

      - name: "SSH 部署并平滑上线 (服务器 2)"
        if: "github.event_name != 'pull_request' && env.SERVER_HOST_2 != ''"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST_2 }}
          username: ${{ env.SERVER_USER_2 }}
          password: ${{ env.SERVER_PASSWORD_2 }}
          port: ${{ env.SERVER_PORT_2 }}
          timeout: "30s"
          command_timeout: "10m"
          script: |
            set -e

            # 1. 自动定位服务器部署目录
            TARGET_DIR=""
            for dir in "/opt/yangcheng-tracehub" "/root/yangcheng-tracehub" "$HOME/yangcheng-tracehub"; do
              if [ -d "$dir" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done

            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="/opt/yangcheng-tracehub"
              mkdir -p "$TARGET_DIR"
            fi
            echo "📂 部署目标目录: $TARGET_DIR"

            # 2. 准备纯净部署目录（保留 data 与 .env.production 等持久化文件，清理历史代码残留）
            if [ -d "$TARGET_DIR" ]; then
              find "$TARGET_DIR" -mindepth 1 -maxdepth 1 ! -name 'data' ! -name '.env*' ! -name 'nginx' -exec rm -rf {} +
            fi
            mkdir -p "$TARGET_DIR"

            # 3. 从 /tmp 解压传输过来的源码包并清理临时文件
            if [ -f /tmp/app-source.tar.gz ]; then
              echo "📥 正在解压最新源码到 $TARGET_DIR..."
              tar -xzf /tmp/app-source.tar.gz -C "$TARGET_DIR"
              rm -f /tmp/app-source.tar.gz
              echo "✅ 源码解压完成！"
            fi
            cd "$TARGET_DIR"

            # 4. 确保持久化目录存在
            mkdir -p data/uploads

            # 5. 更新 docker-compose.yml (独立容器部署，同时暴露 3000 与 3001 端口，对接宿主机公共 Nginx)
            cat << 'COMPOSE_EOF' > docker-compose.yml
            services:
              app:
                build:
                  context: .
                  dockerfile: Dockerfile
                image: yangcheng-tracehub:latest
                container_name: yangcheng-tracehub
                restart: always
                ports:
                  - "3000:3000"
                  - "3001:3000"
                env_file:
                  - .env.production
                environment:
                  ALLOW_DATA_RESET: "test-only"
                volumes:
                  - ./data/uploads:/app/public/uploads
            COMPOSE_EOF

            # 6. 配置生产环境数据库连接 (连接阿里云 RDS 托管 PostgreSQL yangcheng-prod 独立库)
            if [ ! -f .env.production ]; then
              cat << 'ENV_EOF' > .env.production
            NODE_ENV=production
            PORT=3000
            DATABASE_URL="postgresql://wufenshu:Admin%40wfs@pgm-uf6dlr208r8w194n.pg.rds.aliyuncs.com:5432/yangcheng-prod?schema=public"
            AUTH_SECRET="yangcheng-tracehub-secret-key-prod-2026-auth-session"
            NEXT_PUBLIC_TENANT=maoshi
            ENV_EOF
            else
              echo "🔄 确保 .env.production 连接串指向阿里云 RDS PostgreSQL..."
              if grep -q "^DATABASE_URL=" .env.production; then
                sed -i 's|^DATABASE_URL=.*|DATABASE_URL="postgresql://wufenshu:Admin%40wfs@pgm-uf6dlr208r8w194n.pg.rds.aliyuncs.com:5432/yangcheng-prod?schema=public"|g' .env.production
              else
                echo 'DATABASE_URL="postgresql://wufenshu:Admin%40wfs@pgm-uf6dlr208r8w194n.pg.rds.aliyuncs.com:5432/yangcheng-prod?schema=public"' >> .env.production
              fi
            fi

            # 7. 确保 RDS PostgreSQL yangcheng-prod 库中的 public schema 具备建表权限
            echo "🐘 检查并配置 RDS yangcheng-prod 库 public schema 访问权限..."
            docker run --rm -e PGPASSWORD='Admin@wfs' postgres:16-alpine psql -h pgm-uf6dlr208r8w194n.pg.rds.aliyuncs.com -U wufenshu -d yangcheng-prod -c "
              GRANT ALL ON SCHEMA public TO wufenshu;
              GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO wufenshu;
              GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO wufenshu;
            " || true

            # 8. 本地镜像构建并平滑上线
            echo "🔨 正在本地构建 Docker 镜像 (复用本地缓存)..."
            docker compose build app

            echo "🔄 启动并平滑上线容器 (移除遗留无用容器)..."
            docker compose up -d --remove-orphans app

            # 9. 清理悬空未使用的旧镜像，保持磁盘干净
            docker image prune -f || true

            # 10. 状态检查与真实健康探活 (端口 3001)
            echo "🔍 检查容器运行状态..."
            docker compose ps
            echo "📄 查看应用容器最新日志 (前 30 行)..."
            docker compose logs --tail=30 app || true

            echo "🩺 执行本地健康探活 (http://127.0.0.1:3000 与 3001)..."
            PROBE_SUCCESS=false
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:3000/ > /dev/null 2>&1 || curl -sf http://127.0.0.1:3001/ > /dev/null 2>&1; then
                echo "✅ 第 $i 次尝试：应用探活成功，HTTP 正常响应！"
                PROBE_SUCCESS=true
                break
              fi
              echo "⏳ 等待应用就绪... ($i/15)"
              sleep 2
            done

            if [ "$PROBE_SUCCESS" != "true" ]; then
              echo "❌ 错误：应用未能正常启动并对外提供服务！容器崩溃日志："
              docker compose logs --tail=100 app
              exit 1
            fi

            # 11. 重载宿主机 Nginx 确保新端口生效
            echo "🔄 尝试重载宿主机公共 Nginx 配置..."
            (nginx -s reload 2>/dev/null || systemctl reload nginx 2>/dev/null) && echo "✅ 宿主机 Nginx 重载成功！" || true
            echo "✅ 服务器 2 部署成功且服务探活正常！"
