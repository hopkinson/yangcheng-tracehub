name: "生产部署 · 服务器 2 (第二节点)"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      image_tag:
        description: "要部署的镜像版本标签 (默认: latest)"
        required: false
        default: "latest"

jobs:
  build-and-deploy:
    name: "构建并发布到服务器 2"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SERVER_HOST_2: ${{ secrets.SERVER_HOST_2 || vars.SERVER_HOST_2 || secrets.SERVER_2_HOST || vars.SERVER_2_HOST || secrets.SERVER2_HOST || vars.SERVER2_HOST || secrets.SERVER_HOST2 || vars.SERVER_HOST2 || secrets.BACKUP_SERVER_HOST || vars.BACKUP_SERVER_HOST || secrets.SERVER_IP_2 || vars.SERVER_IP_2 || secrets.SERVER2_IP || vars.SERVER2_IP }}
      SERVER_USER_2: ${{ secrets.SERVER_USER_2 || vars.SERVER_USER_2 || secrets.SERVER_2_USER || vars.SERVER_USER_1 || secrets.SERVER_USER || 'root' }}
      SERVER_PASSWORD_2: ${{ secrets.SERVER_PASSWORD_2 || secrets.SERVER_2_PASSWORD || secrets.SERVER2_PASSWORD || secrets.SERVER_PASSWORD_1 || secrets.SERVER_PASSWORD }}
      SERVER_SSH_KEY_2: ${{ secrets.SERVER_SSH_KEY_2 || secrets.SERVER_2_SSH_KEY || secrets.SERVER2_SSH_KEY || secrets.SERVER_SSH_KEY_1 || secrets.SERVER_SSH_KEY }}
      SERVER_PORT_2: ${{ secrets.SERVER_PORT_2 || vars.SERVER_PORT_2 || secrets.SERVER_2_PORT || vars.SERVER_2_PORT || secrets.SERVER_PORT_1 || 22 }}
      TAG: ${{ github.event.inputs.image_tag || 'latest' }}
    steps:
      - name: "检查服务器 2 配置参数"
        id: check_config
        run: |
          if [ -z "$SERVER_HOST_2" ]; then
            echo "⚠️ [提示] 未检测到 SERVER_HOST_2 配置，跳过服务器 2 部署。"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "✅ 目标服务器 2: $SERVER_HOST_2"
            echo "🔌 连接端口: $SERVER_PORT_2"
            echo "👤 登录用户: $SERVER_USER_2"
            if [ -n "$SERVER_PASSWORD_2" ]; then
              echo "🔑 密码配置: 已检测到密码"
            else
              echo "❌ 密码配置: 未配置"
            fi
            if [ -n "$SERVER_SSH_KEY_2" ]; then
              echo "🔐 密钥配置: 已检测到私钥"
            else
              echo "ℹ️ 密钥配置: 未配置私钥 (走纯密码模式)"
            fi
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: "检出代码仓库"
        if: steps.check_config.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: "初始化 pnpm 环境"
        if: steps.check_config.outputs.skip != 'true'
        uses: pnpm/action-setup@v4

      - name: "配置 Node.js 22"
        if: steps.check_config.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: "安装项目依赖"
        if: steps.check_config.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: "生成 Prisma 客户端"
        if: steps.check_config.outputs.skip != 'true'
        run: pnpm prisma:generate

      - name: "TypeScript 类型安全检查"
        if: steps.check_config.outputs.skip != 'true'
        run: pnpm typecheck

      - name: "登录 GitHub Container Registry (GHCR)"
        if: steps.check_config.outputs.skip != 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "配置 Docker Buildx 构建引擎"
        if: steps.check_config.outputs.skip != 'true' && github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: "构建并推送生产 Docker 镜像至 GHCR"
        if: steps.check_config.outputs.skip != 'true' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =========================================================================
      # 方案 A：在 Runner 打包并通过 SCP 传输至服务器 2，彻底杜绝服务器拉取海外 GHCR 超时
      # =========================================================================
      - name: "导出并压缩生产镜像包"
        if: steps.check_config.outputs.skip != 'true' && github.event_name != 'pull_request'
        run: |
          echo "📦 在 Runner 拉取刚构建好的镜像并打包 (Tag: ${{ env.TAG }})..."
          docker pull ghcr.io/${{ github.repository }}:${{ env.TAG }}
          docker save ghcr.io/${{ github.repository }}:${{ env.TAG }} | gzip -1 > app-image.tar.gz
          echo "✅ 镜像打包并压缩完成，文件大小:"
          ls -lh app-image.tar.gz

      - name: "传输镜像包至服务器 2 (密码认证)"
        if: steps.check_config.outputs.skip != 'true' && github.event_name != 'pull_request' && env.SERVER_SSH_KEY_2 == ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST_2 }}
          username: ${{ env.SERVER_USER_2 }}
          password: ${{ env.SERVER_PASSWORD_2 }}
          port: ${{ env.SERVER_PORT_2 }}
          timeout: "60s"
          command_timeout: "10m"
          source: "app-image.tar.gz"
          target: "/tmp"
          overwrite: true

      - name: "传输镜像包至服务器 2 (密钥认证)"
        if: steps.check_config.outputs.skip != 'true' && github.event_name != 'pull_request' && env.SERVER_SSH_KEY_2 != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST_2 }}
          username: ${{ env.SERVER_USER_2 }}
          key: ${{ env.SERVER_SSH_KEY_2 }}
          port: ${{ env.SERVER_PORT_2 }}
          timeout: "60s"
          command_timeout: "10m"
          source: "app-image.tar.gz"
          target: "/tmp"
          overwrite: true

      - name: "SSH 部署并平滑上线 (服务器 2 - 密码认证)"
        if: steps.check_config.outputs.skip != 'true' && github.event_name != 'pull_request' && env.SERVER_SSH_KEY_2 == ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST_2 }}
          username: ${{ env.SERVER_USER_2 }}
          password: ${{ env.SERVER_PASSWORD_2 }}
          port: ${{ env.SERVER_PORT_2 }}
          timeout: "30s"
          command_timeout: "10m"
          script: |
            set -e

            # 1. 从 /tmp 加载传输过来的最新镜像包并立即清理临时文件
            if [ -f /tmp/app-image.tar.gz ]; then
              echo "📥 正在从传输包加载最新 Docker 镜像..."
              docker load < /tmp/app-image.tar.gz
              rm -f /tmp/app-image.tar.gz
              echo "✅ 镜像加载成功！"
            fi

            # 2. 自动定位服务器部署目录
            TARGET_DIR=""
            for dir in "/root/yangcheng-tracehub" "/opt/yangcheng-tracehub" "$HOME/yangcheng-tracehub"; do
              if [ -d "$dir" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done

            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="/opt/yangcheng-tracehub"
              mkdir -p "$TARGET_DIR"
            fi
            echo "📂 部署目标目录: $TARGET_DIR"
            cd "$TARGET_DIR"

            # 3. 确保持久化目录存在
            mkdir -p data/db data/uploads

            # 4. 更新 docker-compose.yml
            cat << 'COMPOSE_EOF' > docker-compose.yml
            services:
              app:
                image: ghcr.io/${{ github.repository }}:${{ env.TAG }}
                container_name: yangcheng-tracehub
                restart: always
                command: sh -c "npx prisma db push --skip-generate && node server.js"
                ports:
                  - "3000:3000"
                env_file:
                  - .env.production
                volumes:
                  - ./data/db:/app/data
                  - ./data/uploads:/app/public/uploads
            COMPOSE_EOF

            # 5. 如果不存在 .env.production，写入默认配置
            if [ ! -f .env.production ]; then
              cat << 'ENV_EOF' > .env.production
            NODE_ENV=production
            PORT=3000
            DATABASE_URL="file:/app/data/app.db"
            AUTH_SECRET="yangcheng-tracehub-secret-key-prod-2026-auth-session"
            NEXT_PUBLIC_TENANT=maoshi
            ENV_EOF
            fi

            # 6. 本地镜像已 load 就绪，直接平滑上线应用容器
            echo "🔄 启动并平滑上线容器..."
            docker compose up -d --no-deps app || docker-compose up -d --no-deps app

            # 7. 清理悬空未使用的旧镜像，保持磁盘干净
            docker image prune -f || true

            # 8. 状态检查
            sleep 3
            docker compose ps
            echo "✅ 服务器 2 部署成功！"

      - name: "SSH 部署并平滑上线 (服务器 2 - 密钥认证)"
        if: steps.check_config.outputs.skip != 'true' && github.event_name != 'pull_request' && env.SERVER_SSH_KEY_2 != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST_2 }}
          username: ${{ env.SERVER_USER_2 }}
          key: ${{ env.SERVER_SSH_KEY_2 }}
          port: ${{ env.SERVER_PORT_2 }}
          timeout: "30s"
          command_timeout: "10m"
          script: |
            set -e

            # 1. 从 /tmp 加载传输过来的最新镜像包并立即清理临时文件
            if [ -f /tmp/app-image.tar.gz ]; then
              echo "📥 正在从传输包加载最新 Docker 镜像..."
              docker load < /tmp/app-image.tar.gz
              rm -f /tmp/app-image.tar.gz
              echo "✅ 镜像加载成功！"
            fi

            # 2. 自动定位服务器部署目录
            TARGET_DIR=""
            for dir in "/root/yangcheng-tracehub" "/opt/yangcheng-tracehub" "$HOME/yangcheng-tracehub"; do
              if [ -d "$dir" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done

            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="/opt/yangcheng-tracehub"
              mkdir -p "$TARGET_DIR"
            fi
            echo "📂 部署目标目录: $TARGET_DIR"
            cd "$TARGET_DIR"

            # 3. 确保持久化目录存在
            mkdir -p data/db data/uploads

            # 4. 更新 docker-compose.yml
            cat << 'COMPOSE_EOF' > docker-compose.yml
            services:
              app:
                image: ghcr.io/${{ github.repository }}:${{ env.TAG }}
                container_name: yangcheng-tracehub
                restart: always
                command: sh -c "npx prisma db push --skip-generate && node server.js"
                ports:
                  - "3000:3000"
                env_file:
                  - .env.production
                volumes:
                  - ./data/db:/app/data
                  - ./data/uploads:/app/public/uploads
            COMPOSE_EOF

            # 5. 如果不存在 .env.production，写入默认配置
            if [ ! -f .env.production ]; then
              cat << 'ENV_EOF' > .env.production
            NODE_ENV=production
            PORT=3000
            DATABASE_URL="file:/app/data/app.db"
            AUTH_SECRET="yangcheng-tracehub-secret-key-prod-2026-auth-session"
            NEXT_PUBLIC_TENANT=maoshi
            ENV_EOF
            fi

            # 6. 本地镜像已 load 就绪，直接平滑上线应用容器
            echo "🔄 启动并平滑上线容器..."
            docker compose up -d --no-deps app || docker-compose up -d --no-deps app

            # 7. 清理悬空未使用的旧镜像，保持磁盘干净
            docker image prune -f || true

            # 8. 状态检查
            sleep 3
            docker compose ps
            echo "✅ 服务器 2 部署成功！"
