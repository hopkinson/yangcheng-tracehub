name: "生产部署 · 服务器 1 (主节点)"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: "构建 GHCR 镜像并发布到服务器 1"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SERVER_HOST_1: ${{ secrets.SERVER_HOST_1 || vars.SERVER_HOST_1 || secrets.SERVER_HOST || vars.SERVER_HOST }}
      SERVER_USER_1: ${{ secrets.SERVER_USER_1 || vars.SERVER_USER_1 || secrets.SERVER_USER || vars.SERVER_USER || 'root' }}
      SERVER_PASSWORD_1: ${{ secrets.SERVER_PASSWORD_1 || secrets.SERVER_PASSWORD }}
      SERVER_SSH_KEY_1: ${{ secrets.SERVER_SSH_KEY_1 || secrets.SERVER_SSH_KEY }}
      SERVER_PORT_1: ${{ secrets.SERVER_PORT_1 || vars.SERVER_PORT_1 || secrets.SERVER_PORT || vars.SERVER_PORT || 22 }}
    steps:
      - name: "检出代码仓库"
        uses: actions/checkout@v4

      - name: "初始化 pnpm 环境"
        uses: pnpm/action-setup@v4

      - name: "配置 Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: "安装项目依赖"
        run: pnpm install --frozen-lockfile

      - name: "生成 Prisma 客户端"
        run: pnpm prisma:generate

      - name: "TypeScript 类型安全检查"
        run: pnpm typecheck

      - name: "初始化测试数据库并运行自动化测试"
        env:
          DATABASE_URL: "file:./dev.db"
          AUTH_SECRET: "test-secret-key-123456"
        run: |
          npx prisma db push
          npx tsx prisma/seed.ts
          pnpm test

      - name: "登录 GitHub Container Registry (GHCR)"
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "配置 Docker Buildx 构建引擎"
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: "构建并推送生产 Docker 镜像至 GHCR"
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =========================================================================
      # 方案 A：在 Runner 打包并通过 SCP 传输至服务器 1，彻底杜绝服务器拉取海外 GHCR 超时
      # =========================================================================
      - name: "导出并压缩生产镜像包"
        if: "github.event_name != 'pull_request' && env.SERVER_HOST_1 != ''"
        run: |
          echo "📦 在 Runner 拉取刚构建好的镜像并打包..."
          docker pull ghcr.io/${{ github.repository }}:latest
          docker save ghcr.io/${{ github.repository }}:latest | gzip -1 > app-image.tar.gz
          echo "✅ 镜像打包并压缩完成，文件大小:"
          ls -lh app-image.tar.gz

      - name: "传输镜像包至服务器 1"
        if: "github.event_name != 'pull_request' && env.SERVER_HOST_1 != ''"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST_1 }}
          username: ${{ env.SERVER_USER_1 }}
          key: ${{ env.SERVER_SSH_KEY_1 }}
          password: ${{ env.SERVER_PASSWORD_1 }}
          port: ${{ env.SERVER_PORT_1 }}
          timeout: "60s"
          command_timeout: "10m"
          source: "app-image.tar.gz"
          target: "/tmp"
          overwrite: true

      - name: "SSH 部署并平滑上线 (服务器 1)"
        if: "github.event_name != 'pull_request' && env.SERVER_HOST_1 != ''"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST_1 }}
          username: ${{ env.SERVER_USER_1 }}
          key: ${{ env.SERVER_SSH_KEY_1 }}
          password: ${{ env.SERVER_PASSWORD_1 }}
          port: ${{ env.SERVER_PORT_1 }}
          timeout: "30s"
          command_timeout: "10m"
          script: |
            set -e

            # 1. 从 /tmp 加载传输过来的最新镜像包并立即清理临时文件
            if [ -f /tmp/app-image.tar.gz ]; then
              echo "📥 正在从传输包加载最新 Docker 镜像..."
              docker load < /tmp/app-image.tar.gz
              rm -f /tmp/app-image.tar.gz
              echo "✅ 镜像加载成功！"
            fi

            # 2. 自动定位服务器部署目录
            TARGET_DIR=""
            for dir in "/root/yangcheng-tracehub" "/opt/yangcheng-tracehub" "$HOME/yangcheng-tracehub"; do
              if [ -d "$dir" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done

            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="/opt/yangcheng-tracehub"
              mkdir -p "$TARGET_DIR"
            fi
            echo "📂 部署目标目录: $TARGET_DIR"
            cd "$TARGET_DIR"

            # 3. 确保持久化目录存在
            mkdir -p data/db data/uploads

            # 4. 更新 docker-compose.yml
            cat << 'COMPOSE_EOF' > docker-compose.yml
            services:
              app:
                image: ghcr.io/${{ github.repository }}:latest
                container_name: yangcheng-tracehub
                restart: always
                command: sh -c "npx prisma db push --skip-generate && node server.js"
                ports:
                  - "3000:3000"
                env_file:
                  - .env.production
                volumes:
                  - ./data/db:/app/data
                  - ./data/uploads:/app/public/uploads
            COMPOSE_EOF

            # 5. 如果不存在 .env.production，写入默认配置
            if [ ! -f .env.production ]; then
              cat << 'ENV_EOF' > .env.production
            NODE_ENV=production
            PORT=3000
            DATABASE_URL="file:/app/data/app.db"
            AUTH_SECRET="yangcheng-tracehub-secret-key-prod-2026-auth-session"
            NEXT_PUBLIC_TENANT=maoshi
            ENV_EOF
            fi

            # 6. 本地镜像已 load 就绪，直接平滑上线应用容器
            echo "🔄 启动并平滑上线容器..."
            docker compose up -d --no-deps app || docker-compose up -d --no-deps app

            # 7. 清理悬空未使用的旧镜像，保持磁盘干净
            docker image prune -f || true

            # 8. 状态与健康检查
            sleep 3
            docker compose ps
            echo "✅ 服务器 1 部署成功！"
