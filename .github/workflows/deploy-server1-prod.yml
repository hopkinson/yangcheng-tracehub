name: "生产部署 · 服务器 1 (正式环境 - 手动触发)"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "确认发布生产环境 (默认: yes)"
        required: true
        default: "yes"

concurrency:
  group: server-1-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: "构建并发布到服务器 1 (正式生产环境)"
    runs-on: ubuntu-latest
    environment: production
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    permissions:
      contents: read
      packages: write
    env:
      SERVER_HOST_1: ${{ secrets.SERVER_HOST_1 || vars.SERVER_HOST_1 || secrets.SERVER_HOST || vars.SERVER_HOST }}
      SERVER_USER_1: ${{ secrets.SERVER_USER_1 || vars.SERVER_USER_1 || secrets.SERVER_USER || vars.SERVER_USER || 'root' }}
      SERVER_PASSWORD_1: ${{ secrets.SERVER_PASSWORD_1 || secrets.SERVER_PASSWORD }}
      SERVER_SSH_KEY_1: ${{ secrets.SERVER_SSH_KEY_1 || secrets.SERVER_SSH_KEY }}
      SERVER_PORT_1: ${{ secrets.SERVER_PORT_1 || vars.SERVER_PORT_1 || secrets.SERVER_PORT || vars.SERVER_PORT || 22 }}
    steps:
      - name: "检查操作确认"
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "yes" ] && [ "${{ github.event.inputs.confirm }}" != "YES" ]; then
            echo "❌ 操作已取消：未确认发布生产环境"
            exit 1
          fi
          echo "✅ 操作已确认，开始执行生产环境部署流水线"

      - name: "检出代码仓库"
        uses: actions/checkout@v4

      - name: "初始化 pnpm 环境"
        uses: pnpm/action-setup@v4

      - name: "配置 Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: "安装项目依赖"
        run: pnpm install --frozen-lockfile

      - name: "生成 Prisma 客户端"
        run: pnpm prisma:generate

      - name: "TypeScript 类型安全检查"
        run: pnpm typecheck

      - name: "初始化测试数据库并运行自动化测试"
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/test?schema=public"
          AUTH_SECRET: "test-secret-key-123456"
        run: |
          npx prisma db push
          npx tsx prisma/seed.ts
          pnpm test

      # =========================================================================
      # 打包纯净源码 (仅 ~1.8MB) 并通过 SCP 传输至服务器 1，彻底杜绝大镜像包传输超时
      # =========================================================================
      - name: "打包生产源码包"
        if: "github.event_name != 'pull_request' && env.SERVER_HOST_1 != ''"
        run: |
          echo "📦 使用 git archive 打包纯净项目源码..."
          git archive --format=tar.gz -o app-source.tar.gz HEAD
          echo "✅ 源码打包完成，文件大小:"
          ls -lh app-source.tar.gz

      - name: "传输源码包至服务器 1 (密码认证)"
        if: "github.event_name != 'pull_request' && env.SERVER_HOST_1 != '' && env.SERVER_SSH_KEY_1 == ''"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST_1 }}
          username: ${{ env.SERVER_USER_1 }}
          password: ${{ env.SERVER_PASSWORD_1 }}
          port: ${{ env.SERVER_PORT_1 }}
          timeout: "60s"
          command_timeout: "5m"
          source: "app-source.tar.gz"
          target: "/tmp"
          overwrite: true

      - name: "SSH 部署并平滑上线 (服务器 1 生产环境)"
        if: "github.event_name != 'pull_request' && env.SERVER_HOST_1 != ''"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST_1 }}
          username: ${{ env.SERVER_USER_1 }}
          password: ${{ env.SERVER_PASSWORD_1 }}
          port: ${{ env.SERVER_PORT_1 }}
          timeout: "30s"
          command_timeout: "10m"
          script: |
            set -e

            # 1. 自动定位服务器部署目录
            TARGET_DIR=""
            for dir in "/opt/yangcheng-tracehub" "/root/yangcheng-tracehub" "$HOME/yangcheng-tracehub"; do
              if [ -d "$dir" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done

            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="/opt/yangcheng-tracehub"
              mkdir -p "$TARGET_DIR"
            fi
            echo "📂 部署目标目录: $TARGET_DIR"

            # 2. 准备纯净部署目录（保留 data 与持久化配置，清理历史代码）
            if [ -d "$TARGET_DIR" ]; then
              find "$TARGET_DIR" -mindepth 1 -maxdepth 1 ! -name 'data*' ! -name '.env*' ! -name 'nginx' -exec rm -rf {} +
            fi
            mkdir -p "$TARGET_DIR"

            # 3. 解压源码包并清理临时文件
            if [ -f /tmp/app-source.tar.gz ]; then
              echo "📥 正在解压最新源码到 $TARGET_DIR..."
              tar -xzf /tmp/app-source.tar.gz -C "$TARGET_DIR"
              rm -f /tmp/app-source.tar.gz
              echo "✅ 源码解压完成！"
            fi
            cd "$TARGET_DIR"

            # 4. 确保持久化目录就绪
            mkdir -p data/postgres data/uploads nginx/ssl

            # 5. 更新 docker-compose.yml
            cat << 'COMPOSE_EOF' > docker-compose.yml
            services:
              db:
                image: postgres:16-alpine
                container_name: yangcheng-db
                restart: always
                environment:
                  POSTGRES_USER: yangcheng
                  POSTGRES_PASSWORD: yangcheng_local_pwd
                  POSTGRES_DB: yangcheng
                volumes:
                  - ./data/postgres:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U yangcheng -d yangcheng"]
                  interval: 5s
                  timeout: 5s
                  retries: 5

              app:
                build:
                  context: .
                  dockerfile: Dockerfile
                image: yangcheng-tracehub:prod
                container_name: yangcheng-tracehub
                restart: always
                ports:
                  - "3000:3000"
                env_file:
                  - .env.production
                volumes:
                  - ./data/uploads:/app/public/uploads
                depends_on:
                  db:
                    condition: service_healthy

              app-test:
                build:
                  context: .
                  dockerfile: Dockerfile
                image: yangcheng-tracehub:test
                container_name: yangcheng-tracehub-test
                restart: always
                ports:
                  - "3001:3000"
                env_file:
                  - .env.test
                environment:
                  ALLOW_DATA_RESET: "test-only"
                volumes:
                  - ./data-test/uploads:/app/public/uploads
                depends_on:
                  db:
                    condition: service_healthy

              nginx:
                image: nginx:alpine
                container_name: yangcheng-nginx
                restart: always
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
                  - ./nginx/ssl:/etc/nginx/ssl:ro
                depends_on:
                  - app
                  - app-test
            COMPOSE_EOF

            # 6. 配置生产环境数据库连接 (连接阿里云 RDS 托管 PostgreSQL yangcheng_tracehub)
            cat << 'ENV_EOF' > .env.production
            NODE_ENV=production
            PORT=3000
            DATABASE_URL="postgresql://yangchenghu88:Yangcheng88-@pgm-uf6032h49cdqz5jc.pg.rds.aliyuncs.com:5432/yangcheng_tracehub?schema=public&connection_limit=10"
            AUTH_SECRET="yangcheng-tracehub-secret-key-prod-2026-auth-session"
            NEXT_PUBLIC_TENANT=default
            ENV_EOF

            # 7. 检测 Docker Compose 命令行工具
            DOCKER_COMPOSE="docker compose"
            if ! docker compose version >/dev/null 2>&1; then
              if command -v docker-compose >/dev/null 2>&1; then
                DOCKER_COMPOSE="docker-compose"
              fi
            fi

            # 8. 启动本地辅助数据库并构建上线生产容器
            echo "🐘 启动本地数据库容器 (yangcheng-db)..."
            $DOCKER_COMPOSE up -d db || true

            echo "🔨 正在本地构建生产环境 Docker 镜像 (yangcheng-tracehub:prod)..."
            $DOCKER_COMPOSE build app

            echo "🔄 启动并平滑上线生产容器 (测试容器保持稳定运行不受影响)..."
            $DOCKER_COMPOSE up -d --no-deps app
            if [ -d "nginx" ] && [ -f "nginx/default.conf" ]; then
              $DOCKER_COMPOSE up -d --no-deps nginx || true
            fi

            # 9. 清理悬空未使用的旧镜像
            docker image prune -f || true

            # 10. 状态检查与健康探活 (仅探活生产服务 3000)
            echo "🔍 检查容器运行状态..."
            $DOCKER_COMPOSE ps
            echo "📄 查看生产容器最新日志 (前 30 行)..."
            $DOCKER_COMPOSE logs --tail=30 app || true

            echo "🩺 执行生产服务健康探活 (http://127.0.0.1:3000)..."
            PROBE_SUCCESS=false
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:3000/ > /dev/null 2>&1; then
                echo "✅ 第 $i 次尝试：生产应用探活成功，HTTP 正常响应！"
                PROBE_SUCCESS=true
                break
              fi
              echo "⏳ 等待生产应用就绪... ($i/15)"
              sleep 2
            done

            if [ "$PROBE_SUCCESS" != "true" ]; then
              echo "❌ 错误：生产服务未能正常启动并对外提供服务！"
              echo "--- 生产崩溃日志 ---"
              $DOCKER_COMPOSE logs --tail=100 app
              exit 1
            fi
            echo "✅ 服务器 1 生产环境部署成功且服务探活正常！"
