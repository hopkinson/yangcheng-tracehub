name: "服务器只读诊断与安全重启"

on:
  workflow_dispatch:
    inputs:
      server:
        description: "选择服务器"
        type: choice
        default: "1"
        options:
          - "1"
          - "2"
      action:
        description: "仅允许查看日志或安全重启；生产清库、seed、破坏性结构同步已禁用"
        type: choice
        default: "logs"
        options:
          - "logs"
          - "restart"
      lines:
        description: "日志行数"
        required: false
        default: "100"

jobs:
  diagnose:
    name: "服务器 ${{ github.event.inputs.server }} 诊断"
    runs-on: ubuntu-latest
    environment: production
    env:
      SERVER_HOST: ${{ github.event.inputs.server == '1' && (secrets.SERVER_HOST_1 || vars.SERVER_HOST_1 || secrets.SERVER_HOST || vars.SERVER_HOST) || (secrets.SERVER_HOST_2 || vars.SERVER_HOST_2 || secrets.SERVER_2_HOST || vars.SERVER_2_HOST || secrets.SERVER2_HOST || vars.SERVER2_HOST) }}
      SERVER_USER: ${{ github.event.inputs.server == '1' && (secrets.SERVER_USER_1 || vars.SERVER_USER_1 || secrets.SERVER_USER || vars.SERVER_USER || 'root') || (secrets.SERVER_USER_2 || vars.SERVER_USER_2 || secrets.SERVER_2_USER || secrets.SERVER_USER || 'root') }}
      SERVER_PASSWORD: ${{ github.event.inputs.server == '1' && (secrets.SERVER_PASSWORD_1 || secrets.SERVER_PASSWORD) || (secrets.SERVER_PASSWORD_2 || secrets.SERVER_2_PASSWORD || secrets.SERVER_PASSWORD) }}
      SERVER_SSH_KEY: ${{ github.event.inputs.server == '1' && (secrets.SERVER_SSH_KEY_1 || secrets.SERVER_SSH_KEY) || (secrets.SERVER_SSH_KEY_2 || secrets.SERVER_2_SSH_KEY || secrets.SERVER_SSH_KEY) }}
      SERVER_PORT: ${{ github.event.inputs.server == '1' && (secrets.SERVER_PORT_1 || vars.SERVER_PORT_1 || secrets.SERVER_PORT || vars.SERVER_PORT || 22) || (secrets.SERVER_PORT_2 || vars.SERVER_PORT_2 || secrets.SERVER_2_PORT || vars.SERVER_2_PORT || 22) }}
    steps:
      - name: "执行诊断 (密码模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY == ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SERVER_PASSWORD }}
          port: ${{ env.SERVER_PORT }}
          command_timeout: "5m"
          script: |
            set -e
            TARGET_DIR="/opt/yangcheng-tracehub"
            [ -d "$TARGET_DIR" ] || TARGET_DIR="/root/yangcheng-tracehub"
            cd "$TARGET_DIR"
            docker compose ps
            if [ "${{ github.event.inputs.action }}" = "restart" ]; then
              docker compose restart app
              sleep 2
            fi
            docker compose logs --tail=${{ github.event.inputs.lines || '100' }} app

      - name: "执行诊断 (密钥模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_PORT }}
          command_timeout: "5m"
          script: |
            set -e
            TARGET_DIR="/opt/yangcheng-tracehub"
            [ -d "$TARGET_DIR" ] || TARGET_DIR="/root/yangcheng-tracehub"
            cd "$TARGET_DIR"
            docker compose ps
            if [ "${{ github.event.inputs.action }}" = "restart" ]; then
              docker compose restart app
              sleep 2
            fi
            docker compose logs --tail=${{ github.event.inputs.lines || '100' }} app
