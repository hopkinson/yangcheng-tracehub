name: "诊断 · 服务器 2 (宿主机网络与 Nginx)"

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: "检查服务器 2 端口、Nginx 与容器状态"
    runs-on: ubuntu-latest
    env:
      SERVER_HOST_2: ${{ secrets.SERVER_HOST_2 || vars.SERVER_HOST_2 || secrets.SERVER_2_HOST || vars.SERVER_2_HOST }}
      SERVER_USER_2: ${{ secrets.SERVER_USER_2 || vars.SERVER_USER_2 || 'root' }}
      SERVER_PASSWORD_2: ${{ secrets.SERVER_PASSWORD_2 || secrets.SERVER_2_PASSWORD }}
      SERVER_PORT_2: ${{ secrets.SERVER_PORT_2 || vars.SERVER_PORT_2 || 22 }}
    steps:
      - name: "SSH 连接服务器 2 诊断"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST_2 }}
          username: ${{ env.SERVER_USER_2 }}
          password: ${{ env.SERVER_PASSWORD_2 }}
          port: ${{ env.SERVER_PORT_2 }}
          timeout: "30s"
          command_timeout: "2m"
          script: |
            echo "=== 1. 宿主机监听端口 (3000, 3001, 80, 443) ==="
            (ss -tulpn 2>/dev/null || netstat -tulpn 2>/dev/null || lsof -i :3000,3001,80,443 2>/dev/null) | grep -E "3000|3001|:80|:443|nginx" || true

            echo "=== 2. Docker 容器状态与端口映射 ==="
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "=== 3. 本地探活 3000 与 3001 端口 ==="
            curl -sv -o /dev/null http://127.0.0.1:3000/ 2>&1 | head -n 15 || true
            curl -sv -o /dev/null http://127.0.0.1:3001/ 2>&1 | head -n 15 || true

            echo "=== 4. 搜索 Nginx 配置中涉及 yangcheng 或 300x 的配置 ==="
            find /etc/nginx /www/server/panel /www/server/nginx /usr/local/nginx -type f \( -name "*.conf" -o -name "*.vhost" \) 2>/dev/null | while read -r conf; do
              if grep -q -E "yangcheng|300[01]" "$conf" 2>/dev/null; then
                echo "--- 配置文件: $conf ---"
                grep -n -C 5 -E "yangcheng|300[01]|proxy_pass" "$conf"
              fi
            done || true

            echo "=== 5. Nginx 最近错误日志 (502 原因) ==="
            find /var/log/nginx /www/wwwlogs /usr/local/nginx/logs -name "*error*.log" 2>/dev/null | while read -r log; do
              echo "--- 错误日志: $log (最近 20 行) ---"
              tail -n 20 "$log"
            done || true
