name: "数据运维 · 一键重置清空业务数据 (超管初始化)"

on:
  workflow_dispatch:
    inputs:
      server:
        description: "选择目标服务器与环境 (测试环境可日常随意重置，生产环境严格加锁保护)"
        type: choice
        default: "1-test (服务器 1: 测试环境【日常重置数据】 admin-test.yangchenghu88.com)"
        options:
          - "1-test (服务器 1: 测试环境【日常重置数据】 admin-test.yangchenghu88.com)"
          - "2 (服务器 2: 毛氏水产 · 生产环境)"
          - "1-prod (服务器 1: 阳澄股份【生产环境·严防误触】)"
      confirm:
        description: "确认清空并初始化 (默认 YES 即可直接执行)"
        type: choice
        default: "YES"
        options:
          - "YES"
          - "NO"

jobs:
  reset-server1-test:
    name: "服务器 1 (测试环境 admin-test) - 执行数据重置与超管初始化"
    if: startsWith(github.event.inputs.server, '1-test') && github.event.inputs.confirm == 'YES'
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST_1 || vars.SERVER_HOST_1 || secrets.SERVER_HOST || vars.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER_1 || vars.SERVER_USER_1 || secrets.SERVER_USER || vars.SERVER_USER || 'root' }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD_1 || secrets.SERVER_PASSWORD }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY_1 || secrets.SERVER_SSH_KEY }}
      SERVER_PORT: ${{ secrets.SERVER_PORT_1 || vars.SERVER_PORT_1 || secrets.SERVER_PORT || vars.SERVER_PORT || 22 }}
    steps:
      - name: "检出最新仓库脚本"
        uses: actions/checkout@v4

      - name: "同步最新重置脚本至服务器 (密码模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY == ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SERVER_PASSWORD }}
          port: ${{ env.SERVER_PORT }}
          timeout: "30s"
          command_timeout: "2m"
          source: "scripts/reset-tenant.js"
          target: "/tmp"
          overwrite: true

      - name: "同步最新重置脚本至服务器 (密钥模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_PORT }}
          timeout: "30s"
          command_timeout: "2m"
          source: "scripts/reset-tenant.js"
          target: "/tmp"
          overwrite: true

      - name: "SSH 执行测试环境重置指令 (密码模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY == ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SERVER_PASSWORD }}
          port: ${{ env.SERVER_PORT }}
          timeout: "30s"
          command_timeout: "5m"
          script: |
            set -e
            TARGET_DIR="/opt/yangcheng-tracehub"
            [ -d "$TARGET_DIR" ] || TARGET_DIR="/root/yangcheng-tracehub"
            cd "$TARGET_DIR"

            # 动态热同步最新 reset-tenant.js 进入测试容器 (app-test)
            if [ -f /tmp/scripts/reset-tenant.js ]; then
              docker compose cp /tmp/scripts/reset-tenant.js app-test:/app/scripts/reset-tenant.js || docker cp /tmp/scripts/reset-tenant.js yangcheng-tracehub-test:/app/scripts/reset-tenant.js || true
              rm -rf /tmp/scripts
            fi

            echo "=== 正在执行【测试环境 admin-test】数据清理与单超管初始化 (完全隔离生产) ==="
            docker compose exec -T app-test node scripts/reset-tenant.js --tenant=default --force
            echo "=== 测试环境重置完成，重启测试容器以刷新状态 ==="
            docker compose restart app-test
            sleep 2
            docker compose ps app-test

      - name: "SSH 执行测试环境重置指令 (密钥模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_PORT }}
          timeout: "30s"
          command_timeout: "5m"
          script: |
            set -e
            TARGET_DIR="/opt/yangcheng-tracehub"
            [ -d "$TARGET_DIR" ] || TARGET_DIR="/root/yangcheng-tracehub"
            cd "$TARGET_DIR"

            # 动态热同步最新 reset-tenant.js 进入测试容器 (app-test)
            if [ -f /tmp/scripts/reset-tenant.js ]; then
              docker compose cp /tmp/scripts/reset-tenant.js app-test:/app/scripts/reset-tenant.js || docker cp /tmp/scripts/reset-tenant.js yangcheng-tracehub-test:/app/scripts/reset-tenant.js || true
              rm -rf /tmp/scripts
            fi

            echo "=== 正在执行【测试环境 admin-test】数据清理与单超管初始化 (完全隔离生产) ==="
            docker compose exec -T app-test node scripts/reset-tenant.js --tenant=default --force
            echo "=== 测试环境重置完成，重启测试容器以刷新状态 ==="
            docker compose restart app-test
            sleep 2
            docker compose ps app-test

  reset-server1-prod:
    name: "服务器 1 (阳澄股份【生产环境】) - 生产数据重置"
    if: startsWith(github.event.inputs.server, '1-prod') && github.event.inputs.confirm == 'YES'
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST_1 || vars.SERVER_HOST_1 || secrets.SERVER_HOST || vars.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER_1 || vars.SERVER_USER_1 || secrets.SERVER_USER || vars.SERVER_USER || 'root' }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD_1 || secrets.SERVER_PASSWORD }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY_1 || secrets.SERVER_SSH_KEY }}
      SERVER_PORT: ${{ secrets.SERVER_PORT_1 || vars.SERVER_PORT_1 || secrets.SERVER_PORT || vars.SERVER_PORT || 22 }}
    steps:
      - name: "检出最新仓库脚本"
        uses: actions/checkout@v4

      - name: "同步最新重置脚本至服务器 (密码模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY == ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SERVER_PASSWORD }}
          port: ${{ env.SERVER_PORT }}
          timeout: "30s"
          command_timeout: "2m"
          source: "scripts/reset-tenant.js"
          target: "/tmp"
          overwrite: true

      - name: "同步最新重置脚本至服务器 (密钥模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_PORT }}
          timeout: "30s"
          command_timeout: "2m"
          source: "scripts/reset-tenant.js"
          target: "/tmp"
          overwrite: true

      - name: "SSH 执行生产环境重置指令 (密码模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY == ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SERVER_PASSWORD }}
          port: ${{ env.SERVER_PORT }}
          timeout: "30s"
          command_timeout: "5m"
          script: |
            set -e
            TARGET_DIR="/opt/yangcheng-tracehub"
            [ -d "$TARGET_DIR" ] || TARGET_DIR="/root/yangcheng-tracehub"
            cd "$TARGET_DIR"

            if [ -f /tmp/scripts/reset-tenant.js ]; then
              docker compose cp /tmp/scripts/reset-tenant.js app:/app/scripts/reset-tenant.js || docker cp /tmp/scripts/reset-tenant.js yangcheng-tracehub:/app/scripts/reset-tenant.js || true
              rm -rf /tmp/scripts
            fi

            echo "=== 正在执行【生产环境 admin】数据清理与单超管初始化 ==="
            docker compose exec -T app node scripts/reset-tenant.js --tenant=default --force
            docker compose restart app
            sleep 2
            docker compose ps app

      - name: "SSH 执行生产环境重置指令 (密钥模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_PORT }}
          timeout: "30s"
          command_timeout: "5m"
          script: |
            set -e
            TARGET_DIR="/opt/yangcheng-tracehub"
            [ -d "$TARGET_DIR" ] || TARGET_DIR="/root/yangcheng-tracehub"
            cd "$TARGET_DIR"

            if [ -f /tmp/scripts/reset-tenant.js ]; then
              docker compose cp /tmp/scripts/reset-tenant.js app:/app/scripts/reset-tenant.js || docker cp /tmp/scripts/reset-tenant.js yangcheng-tracehub:/app/scripts/reset-tenant.js || true
              rm -rf /tmp/scripts
            fi

            echo "=== 正在执行【生产环境 admin】数据清理与单超管初始化 ==="
            docker compose exec -T app node scripts/reset-tenant.js --tenant=default --force
            docker compose restart app
            sleep 2
            docker compose ps app

  reset-server2:
    name: "服务器 2 (毛氏水产) - 执行数据重置与超管初始化"
    if: startsWith(github.event.inputs.server, '2') && github.event.inputs.confirm == 'YES'
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST_2 || vars.SERVER_HOST_2 || secrets.SERVER_2_HOST || vars.SERVER_2_HOST || secrets.SERVER2_HOST || vars.SERVER2_HOST || secrets.SERVER_HOST2 || vars.SERVER_HOST2 || secrets.BACKUP_SERVER_HOST || vars.BACKUP_SERVER_HOST || secrets.SERVER_IP_2 || vars.SERVER_IP_2 || secrets.SERVER2_IP || vars.SERVER2_IP }}
      SERVER_USER: ${{ secrets.SERVER_USER_2 || vars.SERVER_USER_2 || secrets.SERVER_2_USER || vars.SERVER_USER_1 || secrets.SERVER_USER || 'root' }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD_2 || secrets.SERVER_2_PASSWORD || secrets.SERVER2_PASSWORD || secrets.SERVER_PASSWORD_1 || secrets.SERVER_PASSWORD }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY_2 || secrets.SERVER_2_SSH_KEY || secrets.SERVER2_SSH_KEY || secrets.SERVER_SSH_KEY_1 || secrets.SERVER_SSH_KEY }}
      SERVER_PORT: ${{ secrets.SERVER_PORT_2 || vars.SERVER_PORT_2 || secrets.SERVER_2_PORT || vars.SERVER_2_PORT || secrets.SERVER_PORT_1 || 22 }}
    steps:
      - name: "检出最新仓库脚本"
        uses: actions/checkout@v4

      - name: "同步最新重置脚本至服务器 (密码模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY == ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SERVER_PASSWORD }}
          port: ${{ env.SERVER_PORT }}
          timeout: "30s"
          command_timeout: "2m"
          source: "scripts/reset-tenant.js"
          target: "/tmp"
          overwrite: true

      - name: "同步最新重置脚本至服务器 (密钥模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_PORT }}
          timeout: "30s"
          command_timeout: "2m"
          source: "scripts/reset-tenant.js"
          target: "/tmp"
          overwrite: true

      - name: "SSH 执行重置指令 (密码模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY == ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SERVER_PASSWORD }}
          port: ${{ env.SERVER_PORT }}
          timeout: "30s"
          command_timeout: "5m"
          script: |
            set -e
            TARGET_DIR="/opt/yangcheng-tracehub"
            [ -d "$TARGET_DIR" ] || TARGET_DIR="/root/yangcheng-tracehub"
            cd "$TARGET_DIR"

            # 动态热同步最新 reset-tenant.js 进入容器，彻底杜绝历史旧镜像脚本残留导致报错
            if [ -f /tmp/scripts/reset-tenant.js ]; then
              docker compose cp /tmp/scripts/reset-tenant.js app:/app/scripts/reset-tenant.js || docker cp /tmp/scripts/reset-tenant.js yangcheng-tracehub:/app/scripts/reset-tenant.js || true
              rm -rf /tmp/scripts
            fi

            echo "=== 正在执行毛氏分系统数据清理与单超管初始化 (Tenant: maoshi) ==="
            docker compose exec -T app node scripts/reset-tenant.js --tenant=maoshi --force
            echo "=== 重置完成，重启应用容器以刷新状态 ==="
            docker compose restart app
            sleep 2
            docker compose ps

      - name: "SSH 执行重置指令 (密钥模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_PORT }}
          timeout: "30s"
          command_timeout: "5m"
          script: |
            set -e
            TARGET_DIR="/opt/yangcheng-tracehub"
            [ -d "$TARGET_DIR" ] || TARGET_DIR="/root/yangcheng-tracehub"
            cd "$TARGET_DIR"

            # 动态热同步最新 reset-tenant.js 进入容器，彻底杜绝历史旧镜像脚本残留导致报错
            if [ -f /tmp/scripts/reset-tenant.js ]; then
              docker compose cp /tmp/scripts/reset-tenant.js app:/app/scripts/reset-tenant.js || docker cp /tmp/scripts/reset-tenant.js yangcheng-tracehub:/app/scripts/reset-tenant.js || true
              rm -rf /tmp/scripts
            fi

            echo "=== 正在执行毛氏分系统数据清理与单超管初始化 (Tenant: maoshi) ==="
            docker compose exec -T app node scripts/reset-tenant.js --tenant=maoshi --force
            echo "=== 重置完成，重启应用容器以刷新状态 ==="
            docker compose restart app
            sleep 2
            docker compose ps
