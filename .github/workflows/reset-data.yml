name: "测试环境数据重置"

on:
  workflow_dispatch:
    inputs:
      server:
        description: "仅允许重置测试环境；生产环境不提供清库入口"
        type: choice
        default: "1-test (服务器 1: admin-test)"
        options:
          - "1-test (服务器 1: admin-test)"
          - "2-test (服务器 2: 测试环境)"
      confirm:
        description: "我已知晓该操作将清空所选测试数据库并确认执行"
        type: boolean
        default: false

jobs:
  reset-server1-test:
    name: "服务器 1 测试环境 - 重置数据"
    if: startsWith(github.event.inputs.server, '1-test') && (github.event.inputs.confirm == true || github.event.inputs.confirm == 'true')
    runs-on: ubuntu-latest
    environment: test
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST_1 || vars.SERVER_HOST_1 || secrets.SERVER_HOST || vars.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER_1 || vars.SERVER_USER_1 || secrets.SERVER_USER || vars.SERVER_USER || 'root' }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD_1 || secrets.SERVER_PASSWORD }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY_1 || secrets.SERVER_SSH_KEY }}
      SERVER_PORT: ${{ secrets.SERVER_PORT_1 || vars.SERVER_PORT_1 || secrets.SERVER_PORT || vars.SERVER_PORT || 22 }}
    steps:
      - name: "检出最新仓库脚本"
        uses: actions/checkout@v4

      - name: "同步测试环境重置脚本 (密码模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY == ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SERVER_PASSWORD }}
          port: ${{ env.SERVER_PORT }}
          source: "scripts/reset-tenant.js"
          target: "/tmp"
          overwrite: true

      - name: "同步测试环境重置脚本 (密钥模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_PORT }}
          source: "scripts/reset-tenant.js"
          target: "/tmp"
          overwrite: true

      - name: "重置隔离测试数据库 (密码模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY == ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SERVER_PASSWORD }}
          port: ${{ env.SERVER_PORT }}
          command_timeout: "5m"
          script: |
            set -e
            TARGET_DIR="/opt/yangcheng-tracehub"
            [ -d "$TARGET_DIR" ] || TARGET_DIR="/root/yangcheng-tracehub"
            cd "$TARGET_DIR"
            RESET_FLAG="$(docker compose exec -T app-test sh -lc 'printf %s "${ALLOW_DATA_RESET:-}"' | tr -d '\r\n')"
            [ "$RESET_FLAG" = "test-only" ] || { echo "拒绝重置：app-test 未标记为隔离测试环境"; exit 1; }
            docker compose cp /tmp/scripts/reset-tenant.js app-test:/app/scripts/reset-tenant.js
            rm -rf /tmp/scripts
            docker compose exec -T app-test node scripts/reset-tenant.js --tenant=default --force
            docker compose restart app-test

      - name: "重置隔离测试数据库 (密钥模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_PORT }}
          command_timeout: "5m"
          script: |
            set -e
            TARGET_DIR="/opt/yangcheng-tracehub"
            [ -d "$TARGET_DIR" ] || TARGET_DIR="/root/yangcheng-tracehub"
            cd "$TARGET_DIR"
            RESET_FLAG="$(docker compose exec -T app-test sh -lc 'printf %s "${ALLOW_DATA_RESET:-}"' | tr -d '\r\n')"
            [ "$RESET_FLAG" = "test-only" ] || { echo "拒绝重置：app-test 未标记为隔离测试环境"; exit 1; }
            docker compose cp /tmp/scripts/reset-tenant.js app-test:/app/scripts/reset-tenant.js
            rm -rf /tmp/scripts
            docker compose exec -T app-test node scripts/reset-tenant.js --tenant=default --force
            docker compose restart app-test
  reset-server2-test:
    name: "服务器 2 测试环境 - 重置数据"
    if: startsWith(github.event.inputs.server, '2-test') && (github.event.inputs.confirm == true || github.event.inputs.confirm == 'true')
    runs-on: ubuntu-latest
    environment: test
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST_2 || vars.SERVER_HOST_2 || secrets.SERVER_2_HOST || vars.SERVER_2_HOST || secrets.SERVER2_HOST || vars.SERVER2_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER_2 || vars.SERVER_USER_2 || secrets.SERVER_2_USER || secrets.SERVER_USER || 'root' }}
      SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD_2 || secrets.SERVER_2_PASSWORD || secrets.SERVER_PASSWORD }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY_2 || secrets.SERVER_2_SSH_KEY || secrets.SERVER_SSH_KEY }}
      SERVER_PORT: ${{ secrets.SERVER_PORT_2 || vars.SERVER_PORT_2 || secrets.SERVER_2_PORT || vars.SERVER_2_PORT || 22 }}
    steps:
      - name: "检出最新仓库脚本"
        uses: actions/checkout@v4

      - name: "同步测试环境重置脚本 (密码模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY == ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SERVER_PASSWORD }}
          port: ${{ env.SERVER_PORT }}
          source: "scripts/reset-tenant.js"
          target: "/tmp"
          overwrite: true

      - name: "同步测试环境重置脚本 (密钥模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_PORT }}
          source: "scripts/reset-tenant.js"
          target: "/tmp"
          overwrite: true

      - name: "重置服务器 2 隔离测试数据库 (密码模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY == ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SERVER_PASSWORD }}
          port: ${{ env.SERVER_PORT }}
          command_timeout: "5m"
          script: |
            set -e
            TARGET_DIR="/opt/yangcheng-tracehub"
            [ -d "$TARGET_DIR" ] || TARGET_DIR="/root/yangcheng-tracehub"
            cd "$TARGET_DIR"
            RESET_FLAG="$(docker compose exec -T app sh -lc 'printf %s "${ALLOW_DATA_RESET:-}"' | tr -d '\r\n')"
            [ "$RESET_FLAG" = "test-only" ] || { echo "拒绝重置：服务器 2 app 未标记为隔离测试环境"; exit 1; }
            docker compose cp /tmp/scripts/reset-tenant.js app:/app/scripts/reset-tenant.js
            rm -rf /tmp/scripts
            docker compose exec -T app node scripts/reset-tenant.js --tenant=maoshi --force
            docker compose restart app

      - name: "重置服务器 2 隔离测试数据库 (密钥模式)"
        if: env.SERVER_HOST != '' && env.SERVER_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_PORT }}
          command_timeout: "5m"
          script: |
            set -e
            TARGET_DIR="/opt/yangcheng-tracehub"
            [ -d "$TARGET_DIR" ] || TARGET_DIR="/root/yangcheng-tracehub"
            cd "$TARGET_DIR"
            RESET_FLAG="$(docker compose exec -T app sh -lc 'printf %s "${ALLOW_DATA_RESET:-}"' | tr -d '\r\n')"
            [ "$RESET_FLAG" = "test-only" ] || { echo "拒绝重置：服务器 2 app 未标记为隔离测试环境"; exit 1; }
            docker compose cp /tmp/scripts/reset-tenant.js app:/app/scripts/reset-tenant.js
            rm -rf /tmp/scripts
            docker compose exec -T app node scripts/reset-tenant.js --tenant=maoshi --force
            docker compose restart app
