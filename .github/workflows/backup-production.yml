name: "生产数据库备份"

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: "备份 ${{ matrix.name }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: "1"
            name: "服务器 1"
          - server: "2"
            name: "服务器 2"
    env:
      SERVER_HOST: ${{ matrix.server == '1' && (secrets.SERVER_HOST_1 || vars.SERVER_HOST_1 || secrets.SERVER_HOST || vars.SERVER_HOST) || (secrets.SERVER_HOST_2 || vars.SERVER_HOST_2 || secrets.SERVER_2_HOST || vars.SERVER_2_HOST || secrets.SERVER2_HOST || vars.SERVER2_HOST) }}
      SERVER_USER: ${{ matrix.server == '1' && (secrets.SERVER_USER_1 || vars.SERVER_USER_1 || secrets.SERVER_USER || vars.SERVER_USER || 'root') || (secrets.SERVER_USER_2 || vars.SERVER_USER_2 || secrets.SERVER_2_USER || secrets.SERVER_USER || 'root') }}
      SERVER_PASSWORD: ${{ matrix.server == '1' && (secrets.SERVER_PASSWORD_1 || secrets.SERVER_PASSWORD) || (secrets.SERVER_PASSWORD_2 || secrets.SERVER_2_PASSWORD || secrets.SERVER_PASSWORD) }}
      SERVER_SSH_KEY: ${{ matrix.server == '1' && (secrets.SERVER_SSH_KEY_1 || secrets.SERVER_SSH_KEY) || (secrets.SERVER_SSH_KEY_2 || secrets.SERVER_2_SSH_KEY || secrets.SERVER_SSH_KEY) }}
      SERVER_PORT: ${{ matrix.server == '1' && (secrets.SERVER_PORT_1 || vars.SERVER_PORT_1 || secrets.SERVER_PORT || vars.SERVER_PORT || 22) || (secrets.SERVER_PORT_2 || vars.SERVER_PORT_2 || secrets.SERVER_2_PORT || vars.SERVER_2_PORT || 22) }}
    steps:
      - name: "检查服务器配置"
        run: |
          test -n "$SERVER_HOST" || { echo "Missing server host" >&2; exit 1; }
          test -n "$SERVER_SSH_KEY" || test -n "$SERVER_PASSWORD" || { echo "Missing SSH credentials" >&2; exit 1; }

      - name: "执行服务器本地备份"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SERVER_SSH_KEY == '' && env.SERVER_PASSWORD || '' }}
          key: ${{ env.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_PORT }}
          command_timeout: "5m"
          script: |
            set -e
            TARGET_DIR="/opt/yangcheng-tracehub"
            [ -d "$TARGET_DIR" ] || TARGET_DIR="/root/yangcheng-tracehub"
            cd "$TARGET_DIR"
            bash scripts/backup-production-db.sh --label scheduled
