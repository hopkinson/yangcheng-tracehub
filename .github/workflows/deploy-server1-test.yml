name: "测试部署 · 服务器 1 (测试环境 - 自动部署)"

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: "构建并自动发布到服务器 1 (测试环境)"
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      SERVER_HOST_1: ${{ secrets.SERVER_HOST_1 || vars.SERVER_HOST_1 || secrets.SERVER_HOST || vars.SERVER_HOST }}
      SERVER_USER_1: ${{ secrets.SERVER_USER_1 || vars.SERVER_USER_1 || secrets.SERVER_USER || vars.SERVER_USER || 'root' }}
      SERVER_PASSWORD_1: ${{ secrets.SERVER_PASSWORD_1 || secrets.SERVER_PASSWORD }}
      SERVER_SSH_KEY_1: ${{ secrets.SERVER_SSH_KEY_1 || secrets.SERVER_SSH_KEY }}
      SERVER_PORT_1: ${{ secrets.SERVER_PORT_1 || vars.SERVER_PORT_1 || secrets.SERVER_PORT || vars.SERVER_PORT || 22 }}
    steps:
      - name: "检出代码仓库"
        uses: actions/checkout@v4

      - name: "初始化 pnpm 环境"
        uses: pnpm/action-setup@v4

      - name: "配置 Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: "安装项目依赖"
        run: pnpm install --frozen-lockfile

      - name: "生成 Prisma 客户端"
        run: pnpm prisma:generate

      - name: "TypeScript 类型安全检查"
        run: pnpm typecheck

      - name: "初始化测试数据库并运行自动化测试"
        env:
          DATABASE_URL: "file:./dev.db"
          AUTH_SECRET: "test-secret-key-123456"
        run: |
          npx prisma db push
          npx tsx prisma/seed.ts
          pnpm test

      # =========================================================================
      # 打包纯净源码 (仅 ~1.8MB) 并通过 SCP 传输至服务器 1，彻底杜绝大镜像包传输超时
      # =========================================================================
      - name: "打包源码包"
        if: "github.event_name != 'pull_request' && env.SERVER_HOST_1 != ''"
        run: |
          echo "📦 使用 git archive 打包纯净项目源码..."
          git archive --format=tar.gz -o app-source.tar.gz HEAD
          echo "✅ 源码打包完成，文件大小:"
          ls -lh app-source.tar.gz

      - name: "传输源码包至服务器 1 (密码认证)"
        if: "github.event_name != 'pull_request' && env.SERVER_HOST_1 != '' && env.SERVER_SSH_KEY_1 == ''"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST_1 }}
          username: ${{ env.SERVER_USER_1 }}
          password: ${{ env.SERVER_PASSWORD_1 }}
          port: ${{ env.SERVER_PORT_1 }}
          timeout: "60s"
          command_timeout: "5m"
          source: "app-source.tar.gz"
          target: "/tmp"
          overwrite: true

      - name: "传输源码包至服务器 1 (密钥认证)"
        if: "github.event_name != 'pull_request' && env.SERVER_HOST_1 != '' && env.SERVER_SSH_KEY_1 != ''"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST_1 }}
          username: ${{ env.SERVER_USER_1 }}
          key: ${{ env.SERVER_SSH_KEY_1 }}
          port: ${{ env.SERVER_PORT_1 }}
          timeout: "60s"
          command_timeout: "5m"
          source: "app-source.tar.gz"
          target: "/tmp"
          overwrite: true

      - name: "SSH 部署并平滑上线 (服务器 1 测试环境 - 密码认证)"
        if: "github.event_name != 'pull_request' && env.SERVER_HOST_1 != '' && env.SERVER_SSH_KEY_1 == ''"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST_1 }}
          username: ${{ env.SERVER_USER_1 }}
          password: ${{ env.SERVER_PASSWORD_1 }}
          port: ${{ env.SERVER_PORT_1 }}
          timeout: "30s"
          command_timeout: "10m"
          script: |
            set -e

            # 1. 自动定位服务器部署目录
            TARGET_DIR=""
            for dir in "/opt/yangcheng-tracehub" "/root/yangcheng-tracehub" "$HOME/yangcheng-tracehub"; do
              if [ -d "$dir" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done

            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="/opt/yangcheng-tracehub"
              mkdir -p "$TARGET_DIR"
            fi
            echo "📂 部署目标目录: $TARGET_DIR"

            # 2. 准备纯净部署目录（保留 data/data-test 与 .env* 等持久化文件，清理历史代码残留）
            if [ -d "$TARGET_DIR" ]; then
              find "$TARGET_DIR" -mindepth 1 -maxdepth 1 ! -name 'data*' ! -name '.env*' ! -name 'nginx' -exec rm -rf {} +
            fi
            mkdir -p "$TARGET_DIR"

            # 3. 从 /tmp 解压传输过来的源码包并清理临时文件
            if [ -f /tmp/app-source.tar.gz ]; then
              echo "📥 正在解压最新源码到 $TARGET_DIR..."
              tar -xzf /tmp/app-source.tar.gz -C "$TARGET_DIR"
              rm -f /tmp/app-source.tar.gz
              echo "✅ 源码解压完成！"
            fi
            cd "$TARGET_DIR"

            # 4. 确保测试与持久化目录存在 (注意：测试环境部署不触碰生产数据库，不执行生产备份)
            mkdir -p data-test/db data-test/uploads nginx/ssl
            if [ ! -f nginx/ssl/test_fullchain.pem ] && [ -f nginx/ssl/fullchain.pem ]; then
              cp nginx/ssl/fullchain.pem nginx/ssl/test_fullchain.pem 2>/dev/null || true
              cp nginx/ssl/privkey.pem nginx/ssl/test_privkey.pem 2>/dev/null || true
            fi

            # 5. 更新 docker-compose.yml (生产 + 测试双服务解耦)
            cat << 'COMPOSE_EOF' > docker-compose.yml
            services:
              app:
                build:
                  context: .
                  dockerfile: Dockerfile
                image: yangcheng-tracehub:prod
                container_name: yangcheng-tracehub
                restart: always
                ports:
                  - "3000:3000"
                env_file:
                  - .env.production
                volumes:
                  - ./data/db:/app/data
                  - ./data/uploads:/app/public/uploads

              app-test:
                build:
                  context: .
                  dockerfile: Dockerfile
                image: yangcheng-tracehub:test
                container_name: yangcheng-tracehub-test
                restart: always
                ports:
                  - "3001:3000"
                env_file:
                  - .env.test
                environment:
                  ALLOW_DATA_RESET: "test-only"
                volumes:
                  - ./data-test/db:/app/data
                  - ./data-test/uploads:/app/public/uploads

              nginx:
                image: nginx:alpine
                container_name: yangcheng-nginx
                restart: always
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
                  - ./nginx/ssl:/etc/nginx/ssl:ro
                depends_on:
                  - app
                  - app-test
            COMPOSE_EOF

            # 6. 如果不存在测试环境配置，写入默认配置
            if [ ! -f .env.test ]; then
              cat << 'TEST_ENV_EOF' > .env.test
            NODE_ENV=production
            PORT=3000
            DATABASE_URL="file:/app/data/app.db"
            AUTH_SECRET="yangcheng-tracehub-secret-key-test-2026-auth-session"
            NEXT_PUBLIC_TENANT=default
            NEXT_PUBLIC_ENV_TAG=test
            TEST_ENV_EOF
            fi

            # 7. 检测 Docker Compose 命令行工具
            DOCKER_COMPOSE="docker compose"
            if ! docker compose version >/dev/null 2>&1; then
              if command -v docker-compose >/dev/null 2>&1; then
                DOCKER_COMPOSE="docker-compose"
              fi
            fi

            # 8. 仅构建测试镜像并单独更新上线测试容器 (绝对不重启生产容器 app)
            echo "🔨 正在本地构建测试环境 Docker 镜像 (yangcheng-tracehub:test)..."
            $DOCKER_COMPOSE build app-test

            echo "🔄 启动并平滑上线测试容器 (生产容器保持稳定运行不受影响)..."
            $DOCKER_COMPOSE up -d --no-deps app-test
            if [ -d "nginx" ] && [ -f "nginx/default.conf" ]; then
              $DOCKER_COMPOSE up -d --no-deps nginx || true
            fi

            # 9. 清理悬空未使用的旧镜像
            docker image prune -f || true

            # 10. 状态检查与健康探活 (仅探活测试服务 3001)
            echo "🔍 检查容器运行状态..."
            $DOCKER_COMPOSE ps
            echo "📄 查看测试容器最新日志 (前 30 行)..."
            $DOCKER_COMPOSE logs --tail=30 app-test || true

            echo "🩺 执行测试服务健康探活 (http://127.0.0.1:3001)..."
            TEST_PROBE_SUCCESS=false
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:3001/ > /dev/null 2>&1; then
                echo "✅ 第 $i 次尝试：测试应用探活成功，HTTP 正常响应！"
                TEST_PROBE_SUCCESS=true
                break
              fi
              echo "⏳ 等待测试应用就绪... ($i/15)"
              sleep 2
            done

            if [ "$TEST_PROBE_SUCCESS" != "true" ]; then
              echo "❌ 错误：测试服务未能正常启动并对外提供服务！"
              echo "--- 测试崩溃日志 ---"
              $DOCKER_COMPOSE logs --tail=100 app-test
              exit 1
            fi
            echo "✅ 服务器 1 测试环境部署成功且服务探活正常！"

      - name: "SSH 部署并平滑上线 (服务器 1 测试环境 - 密钥认证)"
        if: "github.event_name != 'pull_request' && env.SERVER_HOST_1 != '' && env.SERVER_SSH_KEY_1 != ''"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST_1 }}
          username: ${{ env.SERVER_USER_1 }}
          key: ${{ env.SERVER_SSH_KEY_1 }}
          port: ${{ env.SERVER_PORT_1 }}
          timeout: "30s"
          command_timeout: "10m"
          script: |
            set -e

            # 1. 自动定位服务器部署目录
            TARGET_DIR=""
            for dir in "/opt/yangcheng-tracehub" "/root/yangcheng-tracehub" "$HOME/yangcheng-tracehub"; do
              if [ -d "$dir" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done

            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="/opt/yangcheng-tracehub"
              mkdir -p "$TARGET_DIR"
            fi
            echo "📂 部署目标目录: $TARGET_DIR"

            # 2. 准备纯净部署目录（保留 data/data-test 与 .env* 等持久化文件，清理历史代码残留）
            if [ -d "$TARGET_DIR" ]; then
              find "$TARGET_DIR" -mindepth 1 -maxdepth 1 ! -name 'data*' ! -name '.env*' ! -name 'nginx' -exec rm -rf {} +
            fi
            mkdir -p "$TARGET_DIR"

            # 3. 从 /tmp 解压传输过来的源码包并清理临时文件
            if [ -f /tmp/app-source.tar.gz ]; then
              echo "📥 正在解压最新源码到 $TARGET_DIR..."
              tar -xzf /tmp/app-source.tar.gz -C "$TARGET_DIR"
              rm -f /tmp/app-source.tar.gz
              echo "✅ 源码解压完成！"
            fi
            cd "$TARGET_DIR"

            # 4. 确保测试与持久化目录存在 (注意：测试环境部署不触碰生产数据库，不执行生产备份)
            mkdir -p data-test/db data-test/uploads nginx/ssl
            if [ ! -f nginx/ssl/test_fullchain.pem ] && [ -f nginx/ssl/fullchain.pem ]; then
              cp nginx/ssl/fullchain.pem nginx/ssl/test_fullchain.pem 2>/dev/null || true
              cp nginx/ssl/privkey.pem nginx/ssl/test_privkey.pem 2>/dev/null || true
            fi

            # 5. 更新 docker-compose.yml (生产 + 测试双服务解耦)
            cat << 'COMPOSE_EOF' > docker-compose.yml
            services:
              app:
                build:
                  context: .
                  dockerfile: Dockerfile
                image: yangcheng-tracehub:prod
                container_name: yangcheng-tracehub
                restart: always
                ports:
                  - "3000:3000"
                env_file:
                  - .env.production
                volumes:
                  - ./data/db:/app/data
                  - ./data/uploads:/app/public/uploads

              app-test:
                build:
                  context: .
                  dockerfile: Dockerfile
                image: yangcheng-tracehub:test
                container_name: yangcheng-tracehub-test
                restart: always
                ports:
                  - "3001:3000"
                env_file:
                  - .env.test
                environment:
                  ALLOW_DATA_RESET: "test-only"
                volumes:
                  - ./data-test/db:/app/data
                  - ./data-test/uploads:/app/public/uploads

              nginx:
                image: nginx:alpine
                container_name: yangcheng-nginx
                restart: always
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
                  - ./nginx/ssl:/etc/nginx/ssl:ro
                depends_on:
                  - app
                  - app-test
            COMPOSE_EOF

            # 6. 如果不存在测试环境配置，写入默认配置
            if [ ! -f .env.test ]; then
              cat << 'TEST_ENV_EOF' > .env.test
            NODE_ENV=production
            PORT=3000
            DATABASE_URL="file:/app/data/app.db"
            AUTH_SECRET="yangcheng-tracehub-secret-key-test-2026-auth-session"
            NEXT_PUBLIC_TENANT=default
            NEXT_PUBLIC_ENV_TAG=test
            TEST_ENV_EOF
            fi

            # 7. 检测 Docker Compose 命令行工具
            DOCKER_COMPOSE="docker compose"
            if ! docker compose version >/dev/null 2>&1; then
              if command -v docker-compose >/dev/null 2>&1; then
                DOCKER_COMPOSE="docker-compose"
              fi
            fi

            # 8. 仅构建测试镜像并单独更新上线测试容器 (绝对不重启生产容器 app)
            echo "🔨 正在本地构建测试环境 Docker 镜像 (yangcheng-tracehub:test)..."
            $DOCKER_COMPOSE build app-test

            echo "🔄 启动并平滑上线测试容器 (生产容器保持稳定运行不受影响)..."
            $DOCKER_COMPOSE up -d --no-deps app-test
            if [ -d "nginx" ] && [ -f "nginx/default.conf" ]; then
              $DOCKER_COMPOSE up -d --no-deps nginx || true
            fi

            # 9. 清理悬空未使用的旧镜像
            docker image prune -f || true

            # 10. 状态检查与健康探活 (仅探活测试服务 3001)
            echo "🔍 检查容器运行状态..."
            $DOCKER_COMPOSE ps
            echo "📄 查看测试容器最新日志 (前 30 行)..."
            $DOCKER_COMPOSE logs --tail=30 app-test || true

            echo "🩺 执行测试服务健康探活 (http://127.0.0.1:3001)..."
            TEST_PROBE_SUCCESS=false
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:3001/ > /dev/null 2>&1; then
                echo "✅ 第 $i 次尝试：测试应用探活成功，HTTP 正常响应！"
                TEST_PROBE_SUCCESS=true
                break
              fi
              echo "⏳ 等待测试应用就绪... ($i/15)"
              sleep 2
            done

            if [ "$TEST_PROBE_SUCCESS" != "true" ]; then
              echo "❌ 错误：测试服务未能正常启动并对外提供服务！"
              echo "--- 测试崩溃日志 ---"
              $DOCKER_COMPOSE logs --tail=100 app-test
              exit 1
            fi
            echo "✅ 服务器 1 测试环境部署成功且服务探活正常！"
