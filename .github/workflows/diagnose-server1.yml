name: "诊断 · 服务器 1 线上环境数据与 RDS 对比"

on:
  workflow_dispatch:

concurrency:
  group: server-1-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: "全面检查服务器 1 与 RDS 线上数据"
    runs-on: ubuntu-latest
    env:
      SERVER_HOST_1: ${{ secrets.SERVER_HOST_1 || vars.SERVER_HOST_1 || secrets.SERVER_HOST || vars.SERVER_HOST }}
      SERVER_USER_1: ${{ secrets.SERVER_USER_1 || vars.SERVER_USER_1 || secrets.SERVER_USER || vars.SERVER_USER || 'root' }}
      SERVER_PASSWORD_1: ${{ secrets.SERVER_PASSWORD_1 || secrets.SERVER_PASSWORD }}
      SERVER_SSH_KEY_1: ${{ secrets.SERVER_SSH_KEY_1 || secrets.SERVER_SSH_KEY }}
      SERVER_PORT_1: ${{ secrets.SERVER_PORT_1 || vars.SERVER_PORT_1 || secrets.SERVER_PORT || vars.SERVER_PORT || 22 }}
    steps:
      - name: "SSH 连接服务器 1 诊断数据状态"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_HOST_1 }}
          username: ${{ env.SERVER_USER_1 }}
          password: ${{ env.SERVER_PASSWORD_1 }}
          key: ${{ env.SERVER_SSH_KEY_1 }}
          port: ${{ env.SERVER_PORT_1 }}
          timeout: "30s"
          command_timeout: "5m"
          script: |
            set -e

            echo "=== 1. 阿里云 RDS 线上数据 ==="
            docker run --rm -e PGPASSWORD="Yangcheng88-" postgres:16-alpine psql -h pgm-uf6032h49cdqz5jc.pg.rds.aliyuncs.com -U yangchenghu88 -d yangcheng_tracehub -c "
              SELECT 'User' t, count(*) c FROM \"User\"
              UNION ALL SELECT 'Batch', count(*) FROM \"Batch\"
              UNION ALL SELECT 'Order', count(*) FROM \"Order\"
              UNION ALL SELECT 'OutboundOrder', count(*) FROM \"OutboundOrder\"
              UNION ALL SELECT 'OutboundLine', count(*) FROM \"OutboundLine\";

              SELECT DATE(\"deliveryDate\") as delivery_date, status, count(*), sum(count) as crabs
              FROM \"Order\" GROUP BY DATE(\"deliveryDate\"), status ORDER BY delivery_date DESC;

              SELECT count(*) as total_outbounds, status FROM \"OutboundOrder\" GROUP BY status;
            "

            if docker ps | grep -q yangcheng-db; then
              echo "=== 2. 本地 PostgreSQL yangcheng-db 对比 ==="
              docker exec yangcheng-db psql -U yangcheng -d yangcheng -c "
                SELECT 'User' t, count(*) c FROM \"User\"
                UNION ALL SELECT 'Batch', count(*) FROM \"Batch\"
                UNION ALL SELECT 'Order', count(*) FROM \"Order\"
                UNION ALL SELECT 'OutboundOrder', count(*) FROM \"OutboundOrder\"
                UNION ALL SELECT 'OutboundLine', count(*) FROM \"OutboundLine\";

                SELECT DATE(\"deliveryDate\") as delivery_date, status, count(*), sum(count) as crabs
                FROM \"Order\" GROUP BY DATE(\"deliveryDate\"), status ORDER BY delivery_date DESC;
              "
            fi

            echo "=== 3. 生产容器探活 ==="
            curl -sf http://127.0.0.1:3000/api/health > /dev/null 2>&1 || curl -sf http://127.0.0.1:3000/ > /dev/null 2>&1 && echo "✅ 生产容器 HTTP 正常响应"
