# 阳澄股份大闸蟹全链路溯源品控系统 Nginx 反向代理配置
server {
    listen 80;
    server_name admin.yangchenghu88.com yangcheng.traview.cn _;

    # 客户端上传文件大小限制 (支持批次检测报告/图片大文件上传)
    client_max_body_size 50M;

    # 开启 Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Next.js 静态资源长效缓存
    location /_next/static/ {
        proxy_pass http://app:3000/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 上传文件与静态资源
    location /uploads/ {
        proxy_pass http://app:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Next.js Web 应用核心代理
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        # WebSocket / Server-Sent Events 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # 真实客户端 IP 与 Host 传递 (用于审计日志与安全拦截)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
