# 阳澄股份大闸蟹全链路溯源品控系统 Nginx 反向代理配置
# 1. HTTP 80 端口 -> 自动强制跳转 HTTPS 443
server {
    listen 80;
    server_name admin.yangchenghu88.com yangcheng.traview.cn _;
    return 301 https://$host$request_uri;
}

# 2. HTTPS 443 端口业务代理
server {
    listen 443 ssl;
    server_name admin.yangchenghu88.com yangcheng.traview.cn _;

    # SSL 证书文件 (挂载自 ./nginx/ssl)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL 安全优化参数
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 客户端上传文件大小限制 (支持检测报告/大图上传)
    client_max_body_size 50M;

    # 开启 Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Next.js 静态资源长效缓存
    location /_next/static/ {
        proxy_pass http://app:3000/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 上传文件与静态资源
    location /uploads/ {
        proxy_pass http://app:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Next.js Web 应用核心代理
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        # WebSocket / Server-Sent Events 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # 真实客户端 IP 与 Host 传递
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
